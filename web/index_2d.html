<style>
:root{
  --bg:#070b12; --panel:#0b1220; --panel2:#0e1727;
  --ink:#e9eef7; --dim:#8b98ad; --faint:#5d6a80;
  --line:rgba(150,175,210,.16); --grid:rgba(150,175,210,.075);
  --acc:#63dcc6; --warm:#e6b45e; --blue:#6fa8dc; --red:#e07a6a; --vio:#a894e8;
  --sans:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,-apple-system,sans-serif;
  --mono:"SF Mono",ui-monospace,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--ink); font-family:var(--sans);
  -webkit-font-smoothing:antialiased; overflow:hidden;
  -webkit-text-size-adjust:100%; text-size-adjust:100%;
  -webkit-tap-highlight-color:transparent;
}
.fallback{
  position:fixed; left:16px; bottom:16px; z-index:999; max-width:430px;
  padding:12px 14px; border-radius:9px; font:12.5px/1.65 var(--sans);
  color:#f3dad5; background:rgba(26,14,14,.96); border:1px solid rgba(224,122,106,.45);
  box-shadow:0 10px 30px rgba(0,0,0,.45);
}
.app{height:100vh; display:grid; grid-template-columns:minmax(0,1fr); grid-template-rows:auto auto minmax(0,1fr) auto;}

/* ---------- header ---------- */
header{
  display:flex; align-items:center; justify-content:space-between;
  padding:12px 22px 10px; border-bottom:1px solid var(--line);
  background:linear-gradient(180deg,#0a101b,#070b12);
}
.brand{display:flex; align-items:center; gap:13px}
.mark-img{
  height:52px; width:auto; display:block;
  filter:drop-shadow(0 2px 14px rgba(0,0,0,.55));
}
h1{font-size:15px; margin:0; letter-spacing:.04em; font-weight:600}
.brand p{margin:2px 0 0; font-size:11.5px; color:var(--dim); letter-spacing:.02em}
.chips{display:flex; gap:6px; flex-wrap:wrap; justify-content:flex-end}
.chip{
  font:500 10.5px/1 var(--mono); color:var(--dim); padding:6px 8px; border-radius:6px;
  border:1px solid var(--line); background:rgba(255,255,255,.015); letter-spacing:.02em;
}

/* ---------- rail ---------- */
nav{display:flex; gap:2px; padding:0 14px; border-bottom:1px solid var(--line); overflow-x:auto}
nav::-webkit-scrollbar{height:0}
.step{
  appearance:none; background:none; border:none; color:var(--faint); cursor:pointer;
  padding:11px 14px 10px; font-family:var(--sans); font-size:12.5px; letter-spacing:.03em;
  border-bottom:2px solid transparent; white-space:nowrap; transition:color .18s,border-color .18s;
}
.step b{font:600 10.5px var(--mono); margin-right:7px; color:var(--faint); transition:color .18s}
.step:hover{color:var(--ink)}
.step.on{color:var(--ink); border-bottom-color:var(--acc)}
.step.on b{color:var(--acc)}

/* ---------- main ---------- */
main{display:grid; grid-template-columns:392px minmax(0,1fr); min-height:0}
aside{
  min-width:0;
  padding:26px 26px 30px; overflow-y:auto; border-right:1px solid var(--line);
  background:linear-gradient(180deg,#0a111c,#080d15);
}
aside::-webkit-scrollbar{width:6px}
aside::-webkit-scrollbar-thumb{background:rgba(150,175,210,.18); border-radius:3px}
.kicker{font:600 10.5px var(--mono); letter-spacing:.16em; color:var(--acc); text-transform:uppercase}
h2{font-size:21px; line-height:1.35; margin:9px 0 14px; font-weight:600; letter-spacing:.01em}
.body p{margin:0 0 11px; overflow-wrap:anywhere; font-size:13px; line-height:1.78; color:#c3cddd}
.body p .mn{font-family:var(--mono); font-size:12px; color:var(--ink); background:rgba(99,220,198,.07); padding:1px 4px; border-radius:4px}
.formula{
  margin:14px 0 16px; padding:13px 14px; border-radius:8px; border:1px solid rgba(99,220,198,.18);
  background:linear-gradient(180deg,rgba(99,220,198,.055),rgba(99,220,198,.015));
  font-family:var(--mono); font-size:12.5px; line-height:1.9; color:#d9f3ee; letter-spacing:.01em;
}
.formula i{font-family:Georgia,"Songti SC",serif; font-style:italic; font-size:14px}
.cites{margin-top:16px; padding-top:12px; border-top:1px dashed var(--line); font:11px/1.7 var(--mono); color:var(--faint)}

/* ledger table */
table.ledger{width:100%; border-collapse:collapse; margin:6px 0 4px; font-size:11.5px}
table.ledger th{text-align:left; font:500 10px var(--mono); color:var(--faint); padding:5px 4px; border-bottom:1px solid var(--line); letter-spacing:.06em}
table.ledger td{padding:5px 4px; border-bottom:1px solid rgba(150,175,210,.07); color:#b9c4d6}
table.ledger td.t{font-family:var(--mono); font-size:10.5px; white-space:nowrap}
td.d{color:var(--acc)} td.c{color:var(--warm)} td.i{color:var(--blue)} td.a{color:var(--vio)}

/* ---------- stage ---------- */
#stagewrap{position:relative; min-width:0; min-height:0; background:
  radial-gradient(1200px 700px at 62% 38%, #0c1524 0%, #070b12 62%)}
canvas{position:absolute; top:0; right:0; bottom:0; left:0; width:100%; height:100%; display:block; touch-action:none}
#hud{
  position:absolute; top:16px; right:18px; display:flex; flex-direction:column; gap:1px;
  font-family:var(--mono); font-size:11px; pointer-events:none;
}
.hud-row{display:flex; justify-content:space-between; gap:18px; padding:4px 9px;
  background:rgba(8,13,22,.7); border:1px solid var(--line); border-radius:5px; -webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px)}
.hud-row .k{color:var(--faint)}
.hud-row b{color:var(--ink); font-weight:500}
#controls{
  position:absolute; left:0; right:0; bottom:0; padding:34px 18px 14px;
  display:flex; gap:8px; flex-wrap:wrap; align-items:center;
  background:linear-gradient(180deg,rgba(7,11,18,0),rgba(7,11,18,.9) 55%);
}
.ctl{display:flex; align-items:center; gap:8px; padding:5px 10px; border-radius:7px;
  background:rgba(13,20,33,.82); border:1px solid var(--line); -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px)}
.ctl label{font-size:11px; color:var(--dim); white-space:nowrap}
.ctl output{font:11px var(--mono); color:var(--ink); min-width:44px; text-align:right}
input[type=range]{
  -webkit-appearance:none; appearance:none; width:104px; height:3px; border-radius:2px;
  background:rgba(150,175,210,.24); outline:none; cursor:pointer;
}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none; width:12px; height:12px; border-radius:50%;
  background:var(--acc); box-shadow:0 0 8px rgba(99,220,198,.5); cursor:grab;
}
input[type=range]::-moz-range-track{
  height:3px; border-radius:2px; background:rgba(150,175,210,.24);
}
input[type=range]::-moz-range-thumb{
  width:12px; height:12px; border:none; border-radius:50%;
  background:var(--acc); box-shadow:0 0 8px rgba(99,220,198,.5); cursor:grab;
}
.btn,.tg,.chip2{
  appearance:none; cursor:pointer; font-family:var(--sans); font-size:11.5px;
  color:var(--dim); background:rgba(13,20,33,.82); border:1px solid var(--line);
  padding:7px 11px; border-radius:7px; transition:all .16s; white-space:nowrap; -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px);
}
.btn:hover,.tg:hover,.chip2:hover{color:var(--ink); border-color:rgba(150,175,210,.34)}
.tg.on{color:#06120f; background:var(--acc); border-color:var(--acc); font-weight:600}
.chip2.on{color:#1a1204; background:var(--warm); border-color:var(--warm); font-weight:600}
.hint{position:absolute; left:18px; top:16px; font:10.5px/1.6 var(--mono); color:var(--faint);
  max-width:280px; pointer-events:none}

/* ---------- footer ---------- */
footer{
  padding:7px 22px; border-top:1px solid var(--line); color:var(--faint);
  font:10.5px/1.6 var(--mono); display:flex; gap:16px; justify-content:space-between; flex-wrap:wrap;
  background:#070b12;
}

@media (max-width: 980px){
  main{grid-template-columns:minmax(0,1fr); grid-template-rows:minmax(0,36vh) minmax(0,1fr)}
  aside{border-right:none; border-bottom:1px solid var(--line); padding:13px 15px 14px}
  h2{font-size:17px; margin:6px 0 9px}
  .body p{font-size:12.5px; line-height:1.68; margin-bottom:8px}
  .formula{margin:10px 0 12px; padding:10px 11px; font-size:11.5px}
  .cites{font-size:10px; margin-top:10px; padding-top:8px}
  #hud{top:8px; right:8px; font-size:10px}
  .hint{display:none}
  #controls{padding:20px 10px 8px; gap:6px}
  .ctl{padding:4px 7px}
  input[type=range]{width:74px}
  .btn,.tg,.chip2{padding:6px 9px; font-size:11px}
  .chips{display:none}
  footer span:last-child{display:none}
}
</style>

function makeCh1() {

    Q[idx(c, c, c)] = 1;

    for (let z = 0; z < N; z++) for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
      const dx = Math.min(x, N - x), dy = Math.min(y, N - y), dz = Math.min(z, N - z);
      const r = Math.sqrt(dx * dx + dy * dy + dz * dz);
      if (r > 11.4 && r < 12.6) shell.push(idx(x, y, z));
    }
    for (const i of shell) Q[i] = -1 / shell.length;

    for (let s = 0; s < n; s++) {

        const o0 = N * N * zm, o1 = N * N * zp, zb = N * N * z;
        for (let y = 0; y < N; y++) {
          const ym = (y + N - 1) % N, yp = (y + 1) % N;
          const base = N * y + zb;
          const iy0 = N * ym + zb, iy1 = N * yp + zb;
          const iz0 = o0 + N * y, iz1 = o1 + N * y;
          for (let x = 0; x < N; x++) {
            const xm = (x + N - 1) % N, xp = (x + 1) % N;
            const i = base + x;
            const J = (A[iy0 + x] + A[iy1 + x] + A[base + xm] + A[base + xp]
                     + A[iz0 + x] + A[iz1 + x] - Q[i]) / 6;
            B[i] = (1 - 0.85) * A[i] + 0.85 * J;   // 阻尼 Jacobi：压掉棋盘模
          }

      const t = A; A = B; B = t;   // 交换缓冲
      iters++;

    let m = 0;
    for (let i = 0; i < NN; i += 173) {
      const z = (i / (N * N)) | 0, y = ((i / N) | 0) % N, x = i % N;
      const xm = (x + N - 1) % N, xp = (x + 1) % N;
      const ym = (y + N - 1) % N, yp = (y + 1) % N;
      const zm = (z + N - 1) % N, zp = (z + 1) % N;
      const lap = 6 * A[i] - A[idx(xm, y, z)] - A[idx(xp, y, z)] - A[idx(x, ym, z)]
        - A[idx(x, yp, z)] - A[idx(x, y, zm)] - A[idx(x, y, zp)];
      m = Math.max(m, Math.abs(lap + Q[i]));

      const u = 1 / r;
      cnt++; sx += u; sy += v; sxx += u * u; sxy += u * v;
    }
    const den = cnt * sxx - sx * sx;
    fitA = (cnt * sxy - sx * sy) / den;
    fitC = (sy - fitA * sx) / cnt;

        d[k + 1] = lerp(12, 220, t);

    kicker: "第 1 步 · 舞台与源",

      <p>三维各向同性舞台上，点源的格林函数在 r ≫ a 时是
      <span class="mn">G ~ 1/(4πσr)</span>，σ 由键几何给出（定理 3.1）。
      <b>1/r 的形状来自维数，幅度来自舞台</b>——不是外加的力律。</p>`,
    cites: "Zb012 定理 1.2 · 定理 3.1 ｜ 32³ 周期格，实时 Jacobi 松弛",
    hint: "画面是过源心的格点切片；外圈虚线是补偿电荷。",
    hud: () => hudRows([

      ["残差 (max)", fmtSci(residual, 1)],

function makeCh2() {

      <p>指数 2 不是拟合的，是三维格林函数的导数（Zb051 定理 1.2）。换成二维舞台会得到 1/r，换成四维会得到 1/r³——<b>指数由维数定</b>。</p>
      <p>右图是 96³ 周期立方格上直接算的 <span class="mn">L⁺</span>：|F|·4πr² 从 r=6 的 1.055 走到 r=16 的 0.986。
      偏差分两部分：格距的 O(a²/r²) 各向异性，与周期像的有限尺寸效应。连续极限下它趋于 1。</p>
      <p>记账：1/r² 是<b>导出</b>；把源荷 Q 与质量 M 等同、把 q/m 的普适性（弱等效原理）是两笔<b>具名条件（C）</b>。</p>`,
    cites: "Zb051 定理 1.2 · 定义 2.1 · 表（格点核验 4 条全 PASS）",
    hint: "箭头是 −∇φ；越靠外越接近 1/r²。",
    hud: () => hudRows([
      ["测点 r=6", "1.055"],
      ["r=10", "1.013"],
      ["r=16", "0.986"],
      ["连续值", "1.000"],
    ]),
    controls(root) {
      root.append(toggle("力向量", true, v => { showArrows = v; }));
    },
    enter() { },
    draw(t) {
      ctx.clearRect(0, 0, W, H);
      const pad = 26;
      const side = Math.min(W * 0.52, H - 120);
      const cx = pad + side / 2, cy = (H - 60) / 2, R = side / 2 - 10;

      // 势场背景（同心圆）
      for (let i = 1; i <= 6; i++) {
        circle(cx, cy, (R * i) / 6, "rgba(150,175,210,.10)", 1, null, i === 6 ? [3, 5] : null);
      }
      // 源
      const grd = ctx.createRadialGradient(cx, cy, 0, cx, cy, 46);
      grd.addColorStop(0, "rgba(255,236,190,.85)");
      grd.addColorStop(.35, "rgba(230,180,94,.25)");
      grd.addColorStop(1, "rgba(230,180,94,0)");
      ctx.save(); ctx.fillStyle = grd; ctx.beginPath(); ctx.arc(cx, cy, 46, 0, TAU); ctx.fill(); ctx.restore();
      dot(cx, cy, 6, "#ffe9bd", 20);

      // 力箭头：|F| ∝ 1/r²，长度按 log 压缩
      if (showArrows) {
        const rings = [0.18, 0.32, 0.48, 0.66, 0.86];
        rings.forEach((fr, ri) => {
          const rr = R * fr, n = 14 + ri * 4;
          for (let k = 0; k < n; k++) {
            const th = (k / n) * TAU + ri * 0.21;
            const x = cx + Math.cos(th) * rr, y = cy + Math.sin(th) * rr;
            const len = 9 + 16 / (fr * 3 + 0.5);
            const ux = -Math.cos(th), uy = -Math.sin(th);
            line(x, y, x + ux * len, y + uy * len, "rgba(99,220,198,.32)", 1);
            dot(x + ux * len, y + uy * len, 1.3, "rgba(99,220,198,.55)");
          }
        });
      }
      text("F = −κ r̂ / r²", cx, cy + R + 22, { size: 12, mono: true, color: C.acc, align: "center" });
      text("箭头长度已按对数压缩", cx, cy + R + 40, { size: 10, mono: true, color: C.faint, align: "center" });

      // 右：|F|4πr²
      const px = pad + side + 44, pw = W - px - 36, py = cy - R + 10, ph = 2 * R - 30;
      if (pw < 140) return;
      text("|F| · 4πr² 对 r（96³ 格）", px, py - 16, { size: 11.5, color: C.ink });
      const ymin = 0.955, ymax = 1.075;
      const X = r => px + ((r - 4) / (18 - 4)) * pw;
      const Y = v => py + ph - ((v - ymin) / (ymax - ymin)) * ph;
      // 网格
      for (let v = 0.96; v <= 1.071; v += 0.02) {
        line(px, Y(v), px + pw, Y(v), C.grid);
        text(v.toFixed(2), px - 7, Y(v), { size: 9, mono: true, color: C.faint, align: "right" });
      }
      [6, 10, 14, 18].forEach(r => {
        line(X(r), py, X(r), py + ph, C.grid);
        text(String(r), X(r), py + ph + 12, { size: 9, mono: true, color: C.faint, align: "center" });
      });
      line(px, Y(1), px + pw, Y(1), "rgba(233,238,247,.45)", 1, [4, 4]);
      text("1", px + pw + 6, Y(1), { size: 9.5, mono: true, color: C.dim });

      const rows = D.lattice.rows;
      // 折线
      ctx.save(); ctx.beginPath();
      rows.forEach((p, i) => { i ? ctx.lineTo(X(p.r), Y(p.f)) : ctx.moveTo(X(p.r), Y(p.f)); });
      ctx.strokeStyle = "rgba(99,220,198,.55)"; ctx.lineWidth = 1.4; ctx.stroke(); ctx.restore();
      rows.forEach(p => {
        dot(X(p.r), Y(p.f), 3.4, C.acc, 8);
        text(p.f.toFixed(3), X(p.r), Y(p.f) - 11, { size: 9.5, mono: true, color: C.dim, align: "center" });
      });
      text("r（格距 a = 1）", px + pw / 2, py + ph + 28, { size: 9.5, mono: true, color: C.faint, align: "center" });
      text("r=16 的偏低来自 96³ 周期像", px + pw, py + ph - 2, { size: 9.5, color: C.faint, align: "right" });
    },
  };
}

/* ================================================================
   第 3 步：中心力 → 角动量 → 椭圆
   ================================================================ */
function makeCh3() {
  const S = {
    p: { x: 0.72, y: 0 }, v: { x: 0, y: 0 }, trail: [],
    running: true, speed: 1, sectors: true, lat: false, ratio: 12,
    drag: null, scale: 260, scaleSmooth: 260, acc: 0, alat: 0.72,
  };
  const vc = r => Math.sqrt(GM / r);
  function launch(r, f) {
    S.p = { x: r, y: 0 }; S.v = { x: 0, y: vc(r) * f };
    S.trail.length = 0; S.acc = 0; S.running = true;
    S.alat = r / S.ratio;
  }
  launch(0.72, 1);

  function geom(p = S.p, v = S.v) {
    const r = Math.hypot(p.x, p.y), v2 = v.x * v.x + v.y * v.y;
    const h = p.x * v.y - p.y * v.x;
    const rv = p.x * v.x + p.y * v.y;
    const ex = ((v2 - GM / r) * p.x - rv * v.x) / GM;
    const ey = ((v2 - GM / r) * p.y - rv * v.y) / GM;
    const e = Math.hypot(ex, ey);
    const a = 1 / (2 / r - v2 / GM);
    const pl = h * h / GM;
    return { r, v2, h, e, a, pl, om: Math.atan2(ey, ex), T: a > 0 ? TAU * Math.sqrt(a * a * a / GM) : Infinity };
  }

  function accel(p, out) {
    const r2 = p.x * p.x + p.y * p.y, r = Math.sqrt(r2);
    let ar = -GM / r2, at = 0;
    if (S.lat) {
      const th = Math.atan2(p.y, p.x);
      const q = (S.alat / r) ** 2, c4 = 1.1;
      ar *= 1 + 3 * c4 * q * Math.cos(4 * th);
      at = -4 * c4 * q * Math.sin(4 * th) * GM / r2;
    }
    const c = Math.cos(thOf(p)), s = Math.sin(thOf(p));
    out.x = ar * c - at * s;
    out.y = ar * s + at * c;
    function thOf(q) { return Math.atan2(q.y, q.x); }
    return out;
  }

  const tmpA = { x: 0, y: 0 };
  function step(dt) {
    accel(S.p, tmpA);
    S.v.x += tmpA.x * dt / 2; S.v.y += tmpA.y * dt / 2;
    S.p.x += S.v.x * dt; S.p.y += S.v.y * dt;
    accel(S.p, tmpA);
    S.v.x += tmpA.x * dt / 2; S.v.y += tmpA.y * dt / 2;
  }

  let lastPush = 0;
  function advance(dtReal) {
    if (!S.running) return;
    const r0 = Math.hypot(S.p.x, S.p.y);
    const dtBase = clamp(1.1e-4 * Math.pow(Math.max(r0, 0.08), 1.5), 2e-5, 4e-4);
    S.acc += 0.17 * S.speed * dtReal;
    let n = 0;
    while (S.acc > 0 && n < 3000) {
      const dt = Math.min(dtBase, S.acc);
      step(dt); S.acc -= dt; n++;
      if (S.trail.length === 0 || Math.hypot(S.p.x - S.trail[S.trail.length - 1].x, S.p.y - S.trail[S.trail.length - 1].y) > 0.002) {
        S.trail.push({ x: S.p.x, y: S.p.y });
        if (S.trail.length > 4000) S.trail.shift();
      }
    }
    const g = geom();
    if (g.r > 40 || (g.e < 1 && g.a > 0 && g.r > 30)) { S.trail.length = 0; S.p = { x: 0.72, y: 0 }; S.v = { x: 0, y: vc(0.72) }; }
  }

  function sectorsDraw(g, cx, cy, s) {
    if (!(g.e < 1 && g.a > 0)) return;
    const pts = [[0, 0]];
    for (let k = 0; k <= 8; k++) {
      const M = (k / 8) * TAU;
      let E = M;
      for (let i = 0; i < 40; i++) E -= (E - g.e * Math.sin(E) - M) / (1 - g.e * Math.cos(E));
      const nu = 2 * Math.atan2(Math.sqrt(1 + g.e) * Math.sin(E / 2), Math.sqrt(1 - g.e) * Math.cos(E / 2));
      pts.push([nu, g.pl / (1 + g.e * Math.cos(nu))]);
    }
    for (let k = 0; k < 8; k++) {
      const [n1, r1] = pts[k], [n2, r2] = pts[k + 1];
      ctx.beginPath();
      ctx.moveTo(cx, cy);
      const steps = 26;
      for (let i = 0; i <= steps; i++) {
        const nu = n1 + (n2 - n1) * (i / steps);
        const rr = g.pl / (1 + g.e * Math.cos(nu));
        ctx.lineTo(cx + Math.cos(nu + g.om) * rr * s, cy - Math.sin(nu + g.om) * rr * s);
      }
      ctx.closePath();
      ctx.fillStyle = k % 2 ? "rgba(99,220,198,.075)" : "rgba(230,180,94,.055)";
      ctx.fill();
    }
  }

  function drawConic(g, cx, cy, s, color, dash) {
    ctx.save(); ctx.beginPath();
    const lim = g.e < 1 ? Math.PI : Math.acos(-1 / g.e) - 0.02;
    let started = false;
    for (let i = -180; i <= 180; i++) {
      const nu = (i / 180) * lim;
      const den = 1 + g.e * Math.cos(nu);
      if (den < 0.02) { started = false; continue; }
      const rr = g.pl / den;
      const x = cx + Math.cos(nu + g.om) * rr * s, y = cy - Math.sin(nu + g.om) * rr * s;
      if (!started) { ctx.moveTo(x, y); started = true; } else ctx.lineTo(x, y);
    }
    ctx.strokeStyle = color; ctx.lineWidth = 1.1;
    if (dash) ctx.setLineDash(dash);
    ctx.stroke(); ctx.restore();
  }

  return {
    kicker: "第 3 步 · 中心力",
    title: "为什么是椭圆：角动量 + Binet",
    body: `
      <p>力始终指向源。于是 <span class="mn">L = m r × ṙ</span> 守恒，轨道落在一个平面内；
      面积速度 <span class="mn">dA/dt = L/2m</span> 恒定（Zb051 定理 3.1–3.2）。
      这两条只用"力是中心的"，与指数无关。</p>
      <p>令 <span class="mn">u = 1/r</span>，Binet 方程给出 <span class="mn">u″ + u = κm²/L²</span>，
      通解 <span class="mn">u = (κm²/L²)(1 + e cos θ)</span>——圆锥曲线（定理 4.2–4.3）。</p>
      <div class="formula"><i>r</i> = <i>p</i> / (1 + <i>e</i> cos θ)，&nbsp;&nbsp;<i>T</i>² = (4π²/κ) <i>a</i>³</div>
      <p><b>e、相位、轨道尺度 a 都是积分常数，也就是初值。</b>本篇给的是"给定初值，轨道必是这个形状"，
      不给"初值为什么是这些"——那是形成历史，本库不给。</p>`,
    cites: "Zb051 定理 3.1 / 3.2 / 4.2 / 4.3 / 5.1 ｜ 虚线解析解，实线数值积分",
    hint: "在画布上按住拖一条速度矢量，松手发射。",
    hud: () => {
      const g = geom();
      return hudRows([
        ["e", fmt(g.e, 3)],
        ["a (AU)", isFinite(g.a) ? fmt(g.a, 3) : "∞"],
        ["T (yr)", isFinite(g.T) ? fmt(g.T, 2) : "—"],
        ["h = L/m", fmt(g.h, 3)],
        ["r (AU)", fmt(g.r, 3)],
      ]);
    },
    controls(root) {
      const mk = (label, r, f) => button(label, () => launch(r, f), "chip2");
      root.append(
        mk("圆", 0.72, 1), mk("椭圆", 0.72, 0.78), mk("抛物线", 0.72, 1.414), mk("双曲线", 0.72, 1.45),
        button("重置", () => launch(0.72, 1)),
        toggle("等面积扇形", true, v => { S.sectors = v; }),
        toggle("格距修正", false, v => { S.lat = v; }),
        ctl("r/a", range({
          min: 5, max: 30, step: 1, value: 12,
          onInput: v => { S.ratio = v; S.alat = Math.hypot(S.p.x, S.p.y) / v; S.trail.length = 0; },
        }), el("output", null, "12")),
        ctl("速度", range({
          min: 0.2, max: 4, step: 0.1, value: 1,
          onInput: v => { S.speed = v; },
        })),
      );
      // 让 r/a 的 output 跟随
      const inp = root.querySelectorAll("input[type=range]")[0];
      const out = root.querySelectorAll("output")[0];
      inp.addEventListener("input", () => { out.textContent = inp.value; });
    },
    enter() { if (QS.get("lat") === "1") S.lat = true; },
    resize() { },
    pointer(ev) {
      const rect = cv.getBoundingClientRect();
      const sx = ev.clientX - rect.left, sy = ev.clientY - rect.top;
      const cx = W * 0.46, cy = H * 0.52;
      const toW = (x, y) => ({ x: (x - cx) / S.scaleSmooth, y: -(y - cy) / S.scaleSmooth });
      if (ev.type === "down") {
        S.drag = { a: toW(sx, sy), b: toW(sx, sy) };
        S.running = false;
      } else if (ev.type === "move" && S.drag) {
        S.drag.b = toW(sx, sy);
      } else if (ev.type === "up" && S.drag) {
        const p = S.drag.a, v = { x: (S.drag.b.x - S.drag.a.x) * TAU, y: (S.drag.b.y - S.drag.a.y) * TAU };
        if (Math.hypot(p.x, p.y) > 0.05 && Math.hypot(v.x, v.y) > 0.15) {
          S.p = { x: p.x, y: p.y }; S.v = v; S.trail.length = 0; S.acc = 0;
          S.alat = Math.hypot(p.x, p.y) / S.ratio;
          S.running = true;
        }
        S.drag = null;
      }
    },
    draw(t, dt) {
      advance(dt);
      ctx.clearRect(0, 0, W, H);
      const cx = W * 0.46, cy = H * 0.52;
      const g = geom();

      // 自适应缩放
      let target = 300;
      if (g.e < 1 && g.a > 0) target = Math.min(W, H) * 0.40 / Math.max(0.2, g.a * (1 + g.e));
      else target = Math.min(W, H) * 0.40 / Math.max(1.5, Math.min(8, g.r * 1.2));
      target = clamp(target, 6, 1200);
      S.scaleSmooth = lerp(S.scaleSmooth, target, 0.06);
      S.scale = S.scaleSmooth;
      const s = S.scaleSmooth;

      // 参考圈
      [0.5, 1, 2, 5].forEach(r => {
        circle(cx, cy, r * s, "rgba(150,175,210,.07)", 1);
        if (r * s > 40 && r * s < Math.max(W, H)) {
          text(`${r} AU`, cx + r * s * 0.707, cy - r * s * 0.707, { size: 9, mono: true, color: "rgba(150,175,210,.32)" });
        }
      });

      if (S.sectors && !S.lat) sectorsDraw(g, cx, cy, s);
      drawConic(g, cx, cy, s, "rgba(99,220,198,.42)", [4, 4]);

      // 轨迹
      if (S.trail.length > 1) {
        ctx.save(); ctx.beginPath();
        for (let i = 0; i < S.trail.length; i++) {
          const q = S.trail[i];
          const x = cx + q.x * s, y = cy - q.y * s;
          i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
        }
        ctx.strokeStyle = "rgba(234,240,250,.55)"; ctx.lineWidth = 1.15;
        ctx.lineJoin = "round"; ctx.stroke(); ctx.restore();
      }

      // 源
      const grd = ctx.createRadialGradient(cx, cy, 0, cx, cy, 34);
      grd.addColorStop(0, "rgba(255,238,196,.9)");
      grd.addColorStop(.4, "rgba(230,180,94,.22)");
      grd.addColorStop(1, "rgba(230,180,94,0)");
      ctx.save(); ctx.fillStyle = grd; ctx.beginPath(); ctx.arc(cx, cy, 34, 0, TAU); ctx.fill(); ctx.restore();
      dot(cx, cy, 5, "#ffeec4", 16);

      // 行星
      const px = cx + S.p.x * s, py = cy - S.p.y * s;
      line(cx, cy, px, py, "rgba(234,240,250,.18)", 1, [2, 4]);
      dot(px, py, 4.2, C.blue, 12);

      // 速度矢量
      const vx = S.v.x, vy = S.v.y, vm = Math.hypot(vx, vy);
      if (vm > 1e-6) {
        const L = clamp(vm * s * 0.28, 18, 90);
        const ux = vx / vm, uy = vy / vm;
        line(px, py, px + ux * L, py - uy * L, "rgba(230,180,94,.75)", 1.3);
        dot(px + ux * L, py - uy * L, 2, "rgba(230,180,94,.9)");
        text("v", px + ux * L + 6, py - uy * L - 6, { size: 10, mono: true, color: C.warm });
      }

      // 拖拽预览
      if (S.drag) {
        const p0 = S.drag.a, p1 = S.drag.b;
        const vx0 = (p1.x - p0.x) * TAU, vy0 = (p1.y - p0.y) * TAU;
        const gg = geom({ x: p0.x, y: p0.y }, { x: vx0, y: vy0 });
        drawConic(gg, cx, cy, s, "rgba(230,180,94,.5)", [3, 5]);
        const x0 = cx + p0.x * s, y0 = cy - p0.y * s;
        const x1 = cx + p1.x * s, y1 = cy - p1.y * s;
        line(x0, y0, x1, y1, "rgba(230,180,94,.8)", 1.4);
        dot(x0, y0, 3.5, C.warm);
        text(`e = ${fmt(gg.e, 2)}`, x1 + 8, y1 - 8, { size: 11, mono: true, color: C.warm });
      }

      // 图例
      const ly = H < 560 ? 40 : H - 92;
      text(S.lat ? "格距修正 ON：L 不再严格守恒，轨道进动" : "连续极限：解析圆锥与数值积分重合",
        18, ly, { size: 10.5, mono: true, color: S.lat ? C.warm : C.faint });
      if (S.lat) {
        text(`格距 a = 轨道尺度 / ${S.ratio}`, 18, ly + 18, { size: 10, mono: true, color: C.faint });
      }
    },
  };
}

/* ================================================================
   第 4 步：T² ∝ a³
   ================================================================ */
function makeCh4() {
  let aSel = 1.0, showRes = true;
  return {
    kicker: "第 4 步 · 周期",
    title: "T² = 4π²a³/κ：一条线，九颗星",
    body: `
      <p>椭圆轨道的周期只由半长轴定：</p>
      <div class="formula"><i>T</i>² = (4π²/<i>κ</i>) <i>a</i>³，&nbsp;&nbsp;<i>κ</i> = <i>Q</i>/(4πσ)</div>
      <p>κ 只含源荷与舞台键几何（Zb051 定理 5.1）；两体情形换成 κ_tot（推论 5.2）。</p>
      <p>所以 <span class="mn">T²/a³</span> 对所有行星是同一个数——九颗星落在同一条斜率 3/2 的线上。
      <b>共线是定理要求的，不是拟合出来的。</b>偏离（木星 +0.08%、土星 +0.54%）来自行星相互扰动：
      它们不是二体问题。</p>
      <p>绝对量另算：<span class="mn">GM = κ × 锚</span>（Zb050）。T²/a³ 无量纲，换锚不变；
      以米、秒计的 a 与 T 才依赖锚。</p>`,
    cites: "Zb051 定理 5.1 / 推论 5.2 ｜ Zb050 定理 1.2 ｜ 数据：JPL 近似值",
    hint: "拖动滑杆，看 T 随 a 走；下方是偏离百分比。",
    hud: () => {
      const T = Math.pow(aSel, 1.5);
      return hudRows([
        ["a (AU)", fmt(aSel, 2)],
        ["T (yr)", fmt(T, 3)],
        ["T²/a³", fmt(T * T / (aSel ** 3), 4)],
        ["κ (AU³/yr²)", fmt(GM, 4)],
      ]);
    },
    controls(root) {
      root.append(
        ctl("半长轴 a", range({
          min: 0.25, max: 45, step: 0.01, value: 1,
          onInput: v => { aSel = v; out.textContent = fmt(Math.pow(v, 1.5), 3); },
        }), el("output", null, "1.000")),
        toggle("残差条", true, v => { showRes = v; }),
        el("span", null, ""),
      );
      const out = root.querySelector("output");
      root.lastElementChild.remove();
    },
    enter() { },
    draw() {
      ctx.clearRect(0, 0, W, H);
      const padL = 78, padR = 44, padT = 48, padB = 76;
      const pw = W - padL - padR, ph = H - padT - padB;
      const xmin = 0.2, xmax = 60, ymin = 0.1, ymax = 500;
      const X = a => padL + (Math.log(a / xmin) / Math.log(xmax / xmin)) * pw;
      const Y = T => padT + ph - (Math.log(T / ymin) / Math.log(ymax / ymin)) * ph;

      // 网格
      const xTicks = [0.3, 1, 3, 10, 30], yTicks = [0.3, 1, 3, 10, 30, 100, 300];
      xTicks.forEach(a => {
        line(X(a), padT, X(a), padT + ph, C.grid);
        text(a < 1 ? a.toFixed(1) : String(a), X(a), padT + ph + 14, { size: 9.5, mono: true, color: C.faint, align: "center" });
      });
      yTicks.forEach(T => {
        line(padL, Y(T), padL + pw, Y(T), C.grid);
        text(T < 1 ? T.toFixed(1) : String(T), padL - 8, Y(T), { size: 9.5, mono: true, color: C.faint, align: "right" });
      });
      text("半长轴 a（AU）", padL + pw / 2, padT + ph + 32, { size: 10, mono: true, color: C.dim, align: "center" });
      ctx.save();
      ctx.translate(20, padT + ph / 2); ctx.rotate(-Math.PI / 2);
      ctx.font = `400 10px ${MONO}`; ctx.fillStyle = C.dim; ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.fillText("周期 T（yr）", 0, 0);
      ctx.restore();

      // 定理线
      line(X(xmin), Y(Math.pow(xmin, 1.5)), X(xmax), Y(Math.pow(xmax, 1.5)), "rgba(99,220,198,.5)", 1.4);

      // 行星
      D.planets.forEach(p => {
        const x = X(p.a), y = Y(p.T);
        dot(x, y, 3.6, p.color, 8);
        const dx = p.name === "水星" ? 12 : 9;
        text(p.name, x + dx, y - 9, { size: 10, color: p.color, align: "left" });
      });

      // 选择点
      const ty = Math.pow(aSel, 1.5);
      dot(X(aSel), Y(ty), 5.5, "#fff", 14);
      line(X(aSel), Y(ty), X(aSel), padT + ph, "rgba(255,255,255,.18)", 1, [3, 4]);
      text(`a = ${fmt(aSel, 2)} AU  →  T = ${fmt(ty, 2)} yr`, X(aSel) + 10, Y(ty) + 18,
        { size: 10.5, mono: true, color: "#fff" });

      // 角标
      text("T = a^1.5", X(xmax) - 6, Y(Math.pow(xmax, 1.5)) - 12,
        { size: 11, mono: true, color: C.acc, align: "right" });

      // 残差条
      if (showRes) {
        const bw = 306, bh = 98;
        const bx = padL + pw - bw - 6, by = padT + ph - bh - 26;
        ctx.save();
        ctx.fillStyle = "rgba(8,13,22,.86)"; ctx.strokeStyle = C.line; ctx.lineWidth = 1;
        ctx.beginPath(); ctx.rect(bx, by, bw, bh); ctx.fill(); ctx.stroke();
        ctx.restore();
        text("4π²a³/T² 的偏离（%，对地球）", bx + 12, by + 17, { size: 9.5, mono: true, color: C.dim });
        const mid = by + bh - 26;
        line(bx + 12, mid, bx + bw - 12, mid, "rgba(150,175,210,.22)");
        const dev = D.kepler_dev, step = (bw - 30) / dev.length;
        dev.forEach((d, i) => {
          const x = bx + 16 + step * (i + 0.5);
          const h = d.dev * 46;
          ctx.fillStyle = Math.abs(d.dev) < 0.05 ? "rgba(99,220,198,.8)" : "rgba(230,180,94,.9)";
          ctx.fillRect(x - 5, mid, 10, -h);
        });
        text("内四颗 ≈ 0 ｜ 巨行星 ≈ 0.5%", bx + bw - 12, by + 17,
          { size: 9, mono: true, color: C.faint, align: "right" });
      }
    },
  };
}

/* ================================================================
   第 5 步：半径谱
   ================================================================ */
function makeCh5() {
  const SHELL = D.shell;
  let r0 = SHELL.r0_cal, usePred = false;
  const excluded = new Set();
  let hover = -1;
  const X = n => 46 + ((n + 0.15) / 7.9) * (W - 92);

  function stats() {
    const n = SHELL.a.map(a => Math.log2(a / r0));
    const res = n.map(x => Math.abs(x - Math.round(x)));
    const keep = [];
    for (let i = 0; i < res.length; i++) if (!excluded.has(i)) keep.push(res[i]);
    const F = keep.length ? Math.sqrt(keep.reduce((s, r) => s + r * r, 0) / keep.length) : 0;
    return { n, res, F, keep };
  }

  return {
    kicker: "第 5 步 · 半径",
    title: "半径谱与判据的陷阱",
    body: `
      <p>轨道形状由定律定，半径却不是：a 是初值。但把十个半长轴取 log₂，它们落在整数壳层上：
      <span class="mn">rₙ = r₀·2ⁿ</span>（Zb050 命题 4.5）。</p>
      <p><b>陷阱：</b>若 r₀ 由其中三颗定标（这里取木/土/天的几何平均），那三颗的贴合是构造出来的。
      在图上点掉它们，F 从 0.2300 升到 0.2723。<b>定标体的贴合不能算作检验。</b></p>
      <p>判据要非循环，r₀ 必须有独立来源（命题 4.6）。一个已公开的形态把 r₀ 写成不含太阳系量的常数组合，
      给 0.3109 AU，对定标值偏 +1.1%（式 4.5）——代价是五个微观输入的账。</p>`,
    cites: "Zb050 命题 4.5 / 4.6 / 式 (4.5) ｜ 十体：水金地火带木土天海冥",
    hint: "点天体可把它剔出判据；F 即时重算。",
    hud: () => {
      const s = stats();
      return hudRows([
        ["r₀ (AU)", r0.toFixed(4)],
        ["参与判据", `${SHELL.names.length - excluded.size} / 10`],
        ["F", s.F.toFixed(4)],
        ["参考 F_all", SHELL.F_all.toFixed(4)],
        ["参考 F_keep", SHELL.F_keep.toFixed(4)],
      ]);
    },
    controls(root) {
      const out = el("output", null, r0.toFixed(4));
      const inp = range({
        min: 0.27, max: 0.36, step: 0.0001, value: r0,
        onInput: v => { r0 = v; usePred = false; out.textContent = v.toFixed(4); pred.classList.remove("on"); },
      });
      const pred = button("用预测值 0.3109", () => {
        r0 = SHELL.r0_pred; usePred = true; inp.value = r0; out.textContent = r0.toFixed(4);
        pred.classList.add("on");
      }, "chip2");
      root.append(ctl("r₀", inp, out), pred,
        button("恢复定标值", () => {
          r0 = SHELL.r0_cal; usePred = false; inp.value = r0; out.textContent = r0.toFixed(4);
          pred.classList.remove("on");
        }),
        button("全部纳入", () => excluded.clear()));
    },
    enter() { },
    pointer(ev) {
      if (ev.type === "move") {
        const rect = cv.getBoundingClientRect();
        const mx = ev.clientX - rect.left, my = ev.clientY - rect.top;
        const s = stats();
        let best = -1, bd = 26;
        s.n.forEach((n, i) => {
          const x = X(n), d = Math.abs(x - mx) + Math.abs(my - (H * 0.52)) * 0.6;
          if (d < bd) { bd = d; best = i; }
        });
        hover = best;
      } else if (ev.type === "down") {
        const rect = cv.getBoundingClientRect();
        const mx = ev.clientX - rect.left, my = ev.clientY - rect.top;
        const s = stats();
        let best = -1, bd = 30;
        s.n.forEach((n, i) => {
          const x = X(n), d = Math.hypot(x - mx, H * 0.52 - my);
          if (d < bd) { bd = d; best = i; }
        });
        if (best >= 0) {
          if (excluded.has(best)) excluded.delete(best); else excluded.add(best);
        }
      }
    },
    draw() {
      ctx.clearRect(0, 0, W, H);
      const padL = 46, padR = 46, pw = W - padL - padR;
      const nmin = -0.15, nmax = 7.75;
      const y0 = H * 0.52;
      const s = stats();

      // 壳层竖线
      for (let k = 0; k <= 8; k++) {
        const x = X(k);
        line(x, y0 - 74, x, y0 + 118, "rgba(150,175,210,.11)", 1);
        text(`${k}`, x, y0 + 133, { size: 9.5, mono: true, color: C.faint, align: "center" });
      }
      line(padL - 10, y0, padL + pw + 10, y0, "rgba(150,175,210,.3)", 1);
      text("壳层指数 n = log₂(a/r₀)", padL + pw / 2, y0 + 156, { size: 10, mono: true, color: C.dim, align: "center" });
      text("n", padL - 18, y0 - 2, { size: 10, mono: true, color: C.faint, align: "right" });

      // 天体
      s.n.forEach((n, i) => {
        const x = X(n);
        const res = s.res[i];
        const isCal = SHELL.calib.includes(i);
        const isEx = excluded.has(i);
        const col = isEx ? "rgba(140,155,175,.35)" : isCal ? C.warm : C.acc;
        const yy = y0 - 6;
        // 残差杆
        const rh = res * 210;
        ctx.save();
        ctx.strokeStyle = isEx ? "rgba(140,155,175,.22)" : (isCal ? "rgba(230,180,94,.45)" : "rgba(99,220,198,.42)");
        ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(x, y0 + 12); ctx.lineTo(x, y0 + 20 + rh); ctx.stroke();
        ctx.restore();
        dot(x, y0 + 20 + rh, 2.2, col);
        // 天体点
        dot(x, yy, hover === i ? 6 : 4.2, col, hover === i ? 14 : 6);
        text(SHELL.names[i], x, yy - 22, {
          size: 12, color: isEx ? "rgba(140,155,175,.5)" : C.ink, align: "center",
          weight: hover === i ? 600 : 400,
        });
        text(isEx ? "剔除" : res.toFixed(3), x, y0 + 32 + rh, { size: 8.5, mono: true, color: C.faint, align: "center" });
        if (isCal && !isEx) {
          text("定标", x, yy - 38, { size: 8.5, mono: true, color: "rgba(230,180,94,.75)", align: "center" });
        }
      });

      // 大读数
      const big = s.F;
      text(`F = ${big.toFixed(4)}`, padL, H - 128, { size: 22, mono: true, color: C.ink });
      text(`${SHELL.names.length - excluded.size} 个参与 · 参考 F_all=${SHELL.F_all.toFixed(4)}，F_keep=${SHELL.F_keep.toFixed(4)}`,
        padL, H - 104, { size: 10, mono: true, color: C.faint });
      if (excluded.size === 0) text("↳ 试试点掉 木 / 土 / 天", padL + 240, H - 128, { size: 11, mono: true, color: C.dim });

      // 提示
      if (hover >= 0) {
        const i = hover;
        const a = SHELL.a[i];
        text(`${SHELL.names[i]}：a = ${a.toFixed(3)} AU，n = ${s.n[i].toFixed(3)}，|n−round| = ${s.res[i].toFixed(3)}`,
          W - 24, H - 96, { size: 10.5, mono: true, color: C.ink, align: "right" });
      }
      text("残差杆越长，离整数壳越远", padL, H - 22, { size: 9.5, mono: true, color: C.faint });
    },
  };
}

/* ================================================================
   第 6 步：地月
   ================================================================ */
function makeCh6() {
  const E = D.em;
  let a = E.a0;          // km
  let playing = false;
  let moonAng = 0.6;
  const aMin = 250000, aMax = Math.round(E.af);

  function dayOf(a) {
    const Lorb = E.mu * Math.sqrt(E.GM * a * 1e3);
    const Lspin = E.Ltot - Lorb;
    if (Lspin <= 1e-3) return Infinity;
    return (TAU * E.IE / Lspin) / 3600; // hours
  }
  const monthOf = a => (TAU * Math.sqrt((a * 1e3) ** 3 / E.GM)) / 86400;

  return {
    kicker: "第 6 步 · 地月",
    title: "潮汐：把角动量从自转搬到轨道",
    body: `
      <p>潮汐场是势的 Hessian：</p>
      <div class="formula">E<sub>ij</sub> = −(<i>Q</i>/4πσ)(3n<sub>i</sub>n<sub>j</sub> − δ<sub>ij</sub>)/r³</div>
      <p>径向拉伸、横向压缩（Zb052 定理 1.1）。地球自转快于月球公转（ω_s &gt; ω_o），
      隆起被带向前方，力矩把角动量从自转交给轨道：<b>月球外移、一天变长</b>（定理 3.1–3.2）。
      同步半径 a_sync = (κ_tot/ω_s²)<sup>1/3</sup> 是分界（定理 2.1）；地月 a₀ &gt; a_sync，所以往外走。</p>
      <p>终态由 L_tot 守恒定：F(a) = μ√(κa) + (I₁+I₂)√(κ/a³) = L_tot，取 a &gt; a* 的根（定理 4.1）。
      代入实测值：<b>a_f ≈ 1.44 a₀、T_f ≈ 47.2 天</b>——那时一天等于一个月。</p>
      <p>边界：退行速率要耗散/滞后模型（具名条件 C），本库不给时间表；下面的轴按距离参数化。</p>
      <p>顺带：当前 T_E/T_M = 5/α⁻¹，差 −0.039%（Zb050 命题 4.2，恒星日/恒星月口径）。</p>`,
    cites: "Zb052 定理 1.1 / 2.1 / 3.1–3.2 / 4.1 ｜ Zb050 命题 4.2 ｜ 实测值外接",
    hint: "拖动距离轴：过去 ← → 未来。",
    hud: () => "",
    controls(root) {
      const out = el("output", null, `${Math.round(a).toLocaleString()} km`);
      const inp = range({
        min: aMin, max: aMax, step: 500, value: a,
        onInput: v => { a = v; out.textContent = `${Math.round(v).toLocaleString()} km`; playing = false; },
      });
      root.append(
        ctl("月地距离", inp, out),
        button("回到现在", () => { a = E.a0; inp.value = a; out.textContent = `${Math.round(a).toLocaleString()} km`; playing = false; }),
        toggle("回放", false, v => { playing = v; if (v && a >= aMax - 1000) { a = aMin; inp.value = a; } }),
      );
    },
    enter() { },
    draw(t, dt) {
      if (playing) {
        a += (aMax - aMin) * 0.055 * dt;
        if (a >= aMax) { a = aMax; playing = false; }
        const inp = document.querySelector("#controls input[type=range]");
        const out = document.querySelector("#controls output");
        if (inp) inp.value = a;
        if (out) out.textContent = `${Math.round(a).toLocaleString()} km`;
      }
      moonAng += dt * 0.32;
      ctx.clearRect(0, 0, W, H);

      const cx = W * 0.40, cy = H * 0.54;
      const Rmax = Math.min(W * 0.34, H * 0.42);
      const sc = Rmax / aMax;
      const xm = cx + Math.cos(moonAng) * a * sc;
      const ym = cy - Math.sin(moonAng) * a * sc;

      // 参考圈
      circle(cx, cy, E.a0 * sc, "rgba(150,175,210,.18)", 1, null, [3, 5]);
      circle(cx, cy, E.af * sc, "rgba(150,175,210,.10)", 1, null, [2, 6]);
      circle(cx, cy, a * sc, "rgba(99,220,198,.16)", 1);
      text("现在 a₀", cx + E.a0 * sc * 0.71, cy - E.a0 * sc * 0.71, { size: 9, mono: true, color: C.faint });
      text("终态 a_f", cx + E.af * sc * 0.71, cy + E.af * sc * 0.71, { size: 9, mono: true, color: C.faint });

      // 同步半径
      circle(cx, cy, E.a_sync * sc, "rgba(230,180,94,.55)", 1, null, [2, 3]);
      text("同步半径", cx + E.a_sync * sc + 10, cy + 24, { size: 9, mono: true, color: "rgba(230,180,94,.8)" });

      // 地球
      const Re = 16;
      const lag = clamp(14 * (monthOf(a) / (dayOf(a) / 24) - 1) / 26, 0, 14) * Math.PI / 180;
      const ang = moonAng + lag;
      ctx.save();
      ctx.translate(cx, cy); ctx.rotate(-ang);
      const grd = ctx.createRadialGradient(-5, -5, 2, 0, 0, Re * 1.2);
      grd.addColorStop(0, "#7fc7ea"); grd.addColorStop(.7, "#2b6f9e"); grd.addColorStop(1, "#123a56");
      ctx.beginPath(); ctx.ellipse(0, 0, Re * 1.16, Re * 0.96, 0, 0, TAU);
      ctx.fillStyle = grd; ctx.fill();
      ctx.strokeStyle = "rgba(160,220,255,.35)"; ctx.lineWidth = 1; ctx.stroke();
      // 经线（自转指示）
      ctx.beginPath(); ctx.moveTo(0, -Re * 0.9); ctx.lineTo(0, Re * 0.9);
      ctx.strokeStyle = "rgba(220,240,255,.22)"; ctx.stroke();
      ctx.restore();

      // 月球
      const Mr = 6;
      const mg = ctx.createRadialGradient(xm - 2, ym - 2, 1, xm, ym, Mr);
      mg.addColorStop(0, "#e8e4da"); mg.addColorStop(1, "#8c887e");
      ctx.beginPath(); ctx.arc(xm, ym, Mr, 0, TAU); ctx.fillStyle = mg; ctx.fill();
      // 连线
      line(cx, cy, xm, ym, "rgba(234,240,250,.12)", 1, [2, 5]);

      // 右侧读数
      const d = dayOf(a), m = monthOf(a);
      const px = W * 0.70, py = 52;
      text("随距离读出", px, py - 18, { size: 11, mono: true, color: C.dim });
      const rows = [
        ["月地距离", `${Math.round(a).toLocaleString()} km`],
        ["月周期", `${fmt(m, 2)} 天`],
        ["日长", d > 47 ? `${fmt(d / 24, 2)} 天` : `${fmt(d, 2)} 小时`],
        ["一圈/一月", `${fmt(m / (d / 24), 1)}`],
      ];
      rows.forEach((r, i) => {
        text(r[0], px, py + i * 30, { size: 10.5, color: C.faint });
        text(r[1], px + 110, py + i * 30, { size: 13, mono: true, color: C.ink });
      });

      // L 分配条
      const frac = E.mu * Math.sqrt(E.GM * a * 1e3) / E.Ltot;
      const bx = px, by = py + 150, bw = Math.min(300, W - px - 30), bh = 10;
      ctx.fillStyle = "rgba(99,220,198,.65)"; ctx.fillRect(bx, by, bw * frac, bh);
      ctx.fillStyle = "rgba(230,180,94,.6)"; ctx.fillRect(bx + bw * frac, by, bw * (1 - frac), bh);
      text("L_orb", bx, by + 26, { size: 9.5, mono: true, color: C.acc });
      text("L_spin", bx + bw, by + 26, { size: 9.5, mono: true, color: C.warm, align: "right" });
      text(`${(frac * 100).toFixed(1)}% / ${((1 - frac) * 100).toFixed(1)}%`, bx + bw / 2, by - 12,
        { size: 9.5, mono: true, color: C.dim, align: "center" });
      text("L_tot = L_orb + L_spin 守恒", bx, by + 46, { size: 9.5, mono: true, color: C.faint });

      // 日长 / 月长 曲线
      const gx = px, gy = 300, gw = Math.min(330, W - px - 30), gh = 150;
      text("日长 与 月长（天，对数）：a_f 处相交", gx, gy - 10, { size: 9.5, mono: true, color: C.dim });
      const X2 = v => gx + ((v - aMin) / (aMax - aMin)) * gw;
      const Y2 = d => gy + gh - (Math.log(d / 0.3) / Math.log(60 / 0.3)) * gh;
      line(gx, gy + gh, gx + gw, gy + gh, C.line);
      [0.3, 1, 3, 10, 30].forEach(d => {
        line(gx, Y2(d), gx + gw, Y2(d), C.grid);
        text(d < 1 ? "0.3" : String(d), gx - 6, Y2(d), { size: 8.5, mono: true, color: C.faint, align: "right" });
      });
      [["月长", monthOf, "rgba(99,220,198,.6)"], ["日长", aa => dayOf(aa) / 24, "rgba(230,180,94,.65)"]].forEach(([nm, f, col]) => {
        ctx.beginPath();
        for (let i = 0; i <= 80; i++) {
          const aa = aMin + (aMax - aMin) * i / 80;
          const yy = Y2(f(aa));
          i ? ctx.lineTo(X2(aa), yy) : ctx.moveTo(X2(aa), yy);
        }
        ctx.strokeStyle = col; ctx.lineWidth = 1.3; ctx.stroke();
      });
      line(X2(a), gy, X2(a), gy + gh, "rgba(233,238,247,.16)", 1, [2, 3]);
      dot(X2(a), Y2(monthOf(a)), 2.6, C.acc);
      dot(X2(a), Y2(dayOf(a) / 24), 2.6, C.warm);
      text("月长", gx + 6, gy + 12, { size: 9, mono: true, color: C.acc });
      text("日长", gx + 6, gy + 26, { size: 9, mono: true, color: C.warm });


      // 定标标记
      if (Math.abs(a - E.af) < 1500) {
        text("双同步：一天 = 一个月", cx, cy + Rmax * 1.08, { size: 12, mono: true, color: C.warm, align: "center" });
      }
      text("天体大小已放大；距离按比例", 18, H - 18, { size: 9.5, mono: true, color: C.faint });
    },
  };
}

/* ================================================================
   第 7 步：账本 + 太阳偏置
   ================================================================ */
function makeCh7() {
  let phase = 0;
  return {
    kicker: "第 7 步 · 账本",
    title: "哪些是导出，哪些是买来的",
    body: `
      <p>太阳也不是不动的：</p>
      <div class="formula"><i>b</i><sub>p</sub> = <i>a</i><sub>p</sub> <i>m</i><sub>p</sub> /(<i>M</i> + <i>m</i><sub>p</sub>)</div>
      <p>木星单独把太阳拉离质心 <b>742,444 km = 1.067 R⊙</b>（Zb086 命题 3.1）——太阳中心在太阳本体之外。
      这是代入观测值的结果，不是框架预言。</p>
      <table class="ledger">
        <tr><th>量</th><th>档位</th><th>出处</th></tr>
        <tr><td>1/r² 力</td><td class="t d">导出</td><td class="t">Zb012·Zb051</td></tr>
        <tr><td>κ = Q/4πσ</td><td class="t d">导出</td><td class="t">Zb051</td></tr>
        <tr><td>椭圆 / T²∝a³</td><td class="t d">导出</td><td class="t">Zb051</td></tr>
        <tr><td>源荷 ↔ 质量</td><td class="t c">条件 C</td><td class="t">Zb017</td></tr>
        <tr><td>q/m 普适</td><td class="t c">条件 C</td><td class="t">Zb051</td></tr>
        <tr><td>e / 相位 / a</td><td class="t i">初值</td><td class="t">Zb051</td></tr>
        <tr><td>坐标 r(t)</td><td class="t i">选择 I</td><td class="t">Zb051</td></tr>
        <tr><td>a、T 的米制值</td><td class="t a">锚</td><td class="t">Zb005·Zb050</td></tr>
        <tr><td>潮汐张量</td><td class="t d">导出</td><td class="t">Zb052</td></tr>
        <tr><td>同步半径</td><td class="t d">导出</td><td class="t">Zb052</td></tr>
        <tr><td>耗散 / 滞后</td><td class="t c">条件 C</td><td class="t">Zb052</td></tr>
        <tr><td>转动惯量 / a₀</td><td class="t i">外部输入</td><td class="t">Zb052</td></tr>
      </table>
      <p>一句话：<b>定律是导出的，半径与偏心率是初值，绝对大小靠锚。</b>
      "轨道怎么形成"在 Zero 里被拆成三问：形状（导出）、周期（导出）、半径分布（壳层判据，非循环来源未收口）。</p>`,
    cites: "Zb086 命题 3.1 ｜ 表 3.1 ｜ R⊙ = 6.957×10⁵ km",
    hint: "太阳绕系统质心转，半径 1.067 R⊙。",
    hud: () => "",
    controls(root) {
      root.append(el("span", null, ""));
    },
    enter() { },
    draw(t, dt) {
      phase += dt * 0.35;
      ctx.clearRect(0, 0, W, H);
      const cx = W * 0.40, cy = H * 0.46;
      const R = Math.min(W * 0.105, H * 0.17);     // 太阳半径（像素）
      const bR = D.bias[0].b / D.Rsun;             // 1.067
      const bx = cx + bR * R, by = cy;

      // 质心圆
      circle(bx, by, bR * R, "rgba(150,175,210,.25)", 1, null, [4, 5]);
      dot(bx, by, 3, C.warm, 8);
      text("系统质心", bx - 10, by + 16, { size: 10, mono: true, color: C.warm, align: "right" });

      // 太阳沿圆走
      const sx = bx + bR * R * Math.cos(phase), sy = by + bR * R * Math.sin(phase);
      const g = ctx.createRadialGradient(sx, sy, 0, sx, sy, R);
      g.addColorStop(0, "#fff4cf"); g.addColorStop(.55, "#f0b955"); g.addColorStop(1, "#9c5f16");
      ctx.beginPath(); ctx.arc(sx, sy, R, 0, TAU); ctx.fillStyle = g; ctx.fill();
      ctx.strokeStyle = "rgba(255,220,150,.5)"; ctx.lineWidth = 1; ctx.stroke();

      // 连线与标注
      line(sx, sy, bx, by, "rgba(230,180,94,.6)", 1, [2, 3]);
      text(`b = 1.067 R⊙`, bx, by - bR * R - 14, { size: 10.5, mono: true, color: C.warm, align: "center" });
      text("太阳中心 → 质心：742,444 km", cx, cy + R + 34, { size: 11.5, mono: true, color: C.ink, align: "center" });
      text("（木星单独贡献；质心落在太阳本体之外）", cx, cy + R + 54, { size: 10, color: C.faint, align: "center" });

      // 右侧柱状：b/R⊙
      const px = W * 0.62, pw = W - px - 40;
      text("各行星把太阳拉离质心多少", px, 44, { size: 11, mono: true, color: C.dim });
      const rows = D.bias;
      const maxv = 1.1, bw = Math.min(pw - 120, 150);
      rows.forEach((r, i) => {
        const y = 76 + i * 34;
        const w = (r.b / D.Rsun / maxv) * bw;
        ctx.fillStyle = i === 0 ? "rgba(230,180,94,.75)" : "rgba(99,220,198,.45)";
        ctx.fillRect(px + 54, y - 5, Math.max(1, w), 10);
        text(r.name, px, y, { size: 10.5, color: C.ink });
        text((r.b / D.Rsun).toFixed(3), px + 54 + w + 8, y, { size: 9.5, mono: true, color: C.faint });
      });
      text("单位：R⊙", px + 54, 76 + rows.length * 34 + 4, { size: 9, mono: true, color: C.faint });
    },
  };
}

/* ================================================================
   应用骨架
   ================================================================ */
const chapters = [makeCh1(), makeCh2(), makeCh3(), makeCh4(), makeCh5(), makeCh6(), makeCh7()];
const RAIL = ["势", "力", "轨道", "周期", "半径", "地月", "账本"];
let cur = 0;
const rail = $("#rail"), narr = $("#narr"), hud = $("#hud"), controls = $("#controls"), hint = $("#hint");

chapters.forEach((ch, i) => {
  const b = el("button", "step");
  b.append(el("b", null, String(i + 1)), document.createTextNode(RAIL[i]));
  b.addEventListener("click", () => go(i));
  rail.append(b);
});

function go(i) {
  cur = i;
  const ch = chapters[i];
  [...rail.children].forEach((b, k) => b.classList.toggle("on", k === i));
  $("#kicker").textContent = ch.kicker;
  $("#ctitle").textContent = ch.title;
  $("#cbody").innerHTML = ch.body;
  $("#ccites").textContent = ch.cites;
  hint.textContent = ch.hint || "";
  controls.innerHTML = "";
  ch.controls && ch.controls(controls);
  hud.innerHTML = "";
  hudAcc = 1;
  ch.enter && ch.enter();
}

// 指针事件分发给当前章
function stagePos(ev) {
  const r = cv.getBoundingClientRect();
  return { x: ev.clientX - r.left, y: ev.clientY - r.top };
}
cv.addEventListener("pointerdown", ev => {
  const ch = chapters[cur];
  if (!ch.pointer) return;
  cv.setPointerCapture(ev.pointerId);
  ch.pointer({ type: "down", clientX: ev.clientX, clientY: ev.clientY });
});
cv.addEventListener("pointermove", ev => {
  const ch = chapters[cur];
  if (!ch.pointer) return;
  ch.pointer({ type: "move", clientX: ev.clientX, clientY: ev.clientY });
});
cv.addEventListener("pointerup", ev => {
  const ch = chapters[cur];
  if (!ch.pointer) return;
  ch.pointer({ type: "up", clientX: ev.clientX, clientY: ev.clientY });
});

window.addEventListener("keydown", e => {
  if (e.key === "ArrowRight") { go((cur + 1) % chapters.length); e.preventDefault(); }
  if (e.key === "ArrowLeft") { go((cur + chapters.length - 1) % chapters.length); e.preventDefault(); }
});
window.addEventListener("resize", () => { resize(); });

let last = performance.now(), hudAcc = 0;
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  const ch = chapters[cur];
  resizeIfNeeded();
  ch.draw && ch.draw(now / 1000, dt);
  hudAcc += dt;
  if (hudAcc > 0.12 && ch.hud) { hud.innerHTML = ch.hud(); hudAcc = 0; }
  requestAnimationFrame(frame);
}

let lastW = 0, lastH = 0;
function resizeIfNeeded() {
  const r = cv.parentElement.getBoundingClientRect();
  if (Math.abs(r.width - lastW) > 0.5 || Math.abs(r.height - lastH) > 0.5) {
    lastW = r.width; lastH = r.height;
    resize();
  }
}

/* ---------------- 自检（无头浏览器可读） ---------------- */
const ST = [];
function st(name, ok, detail) { ST.push({ name, ok: !!ok, detail }); }

function selfTest() {
  // 1. 壳层判据
  st("F_all ≈ 0.2300", Math.abs(D.shell.F_all - 0.23) < 2e-3, D.shell.F_all.toFixed(4));
  st("F_keep ≈ 0.2723", Math.abs(D.shell.F_keep - 0.2723) < 2e-3, D.shell.F_keep.toFixed(4));
  // 2. 开普勒第三定律
  let worst = 0;
  D.planets.forEach(p => { worst = Math.max(worst, Math.abs(4 * Math.PI ** 2 * p.a ** 3 / p.T ** 2 / (4 * Math.PI ** 2) - 1)); });
  st("T²∝a³ 最大偏离 < 1%", worst < 0.01, (worst * 100).toFixed(3) + "%");
  // 3. 地月终态
  const a_f = D.em.af * 1e3, GMt = D.em.GM;
  const Tm = 2 * Math.PI * Math.sqrt(a_f ** 3 / GMt) / 86400;
  st("a_f/a₀ ≈ 1.44", Math.abs(D.em.af / D.em.a0 - 1.44) < 0.01, (D.em.af / D.em.a0).toFixed(4));
  st("T_f ≈ 47.2 d", Math.abs(Tm - 47.2) < 0.1, Tm.toFixed(2));
  const day0 = (2 * Math.PI * D.em.IE / (D.em.Ltot - D.em.mu * Math.sqrt(GMt * D.em.a0 * 1e3))) / 3600;
  st("当前日长 ≈ 23.93 h", Math.abs(day0 - 23.934) < 0.01, day0.toFixed(3));

  // 4. 轨道积分器：圆轨道闭合与角动量
  let p = { x: 1, y: 0 }, v = { x: 0, y: 2 * Math.PI }, h0 = p.x * v.y - p.y * v.x;
  let maxR = 0, maxDh = 0;
  const dt = 2e-4;
  for (let i = 0; i < 3 / dt; i++) {
    const r0 = Math.hypot(p.x, p.y);
    const a1 = { x: -GM * p.x / r0 ** 3, y: -GM * p.y / r0 ** 3 };
    v.x += a1.x * dt / 2; v.y += a1.y * dt / 2;
    p.x += v.x * dt; p.y += v.y * dt;
    const r1 = Math.hypot(p.x, p.y);
    const a2 = { x: -GM * p.x / r1 ** 3, y: -GM * p.y / r1 ** 3 };
    v.x += a2.x * dt / 2; v.y += a2.y * dt / 2;
    maxR = Math.max(maxR, Math.abs(Math.hypot(p.x, p.y) - 1));
    maxDh = Math.max(maxDh, Math.abs(p.x * v.y - p.y * v.x - h0));
  }
  st("圆轨道半径漂移 < 1e-3", maxR < 1e-3, maxR.toExponential(2));
  st("角动量漂移 < 1e-5", maxDh < 1e-5, maxDh.toExponential(2));
  // 5. 偏置
  st("木星偏置 742,444 km", Math.abs(D.bias[0].b - 742444) < 200, Math.round(D.bias[0].b).toString());

  const bad = ST.filter(s => !s.ok);
  window.__SELFTEST = { pass: ST.length - bad.length, total: ST.length, items: ST };
  const box = document.createElement("div");
  box.id = "selftest";
  box.style.display = "none";
  box.textContent = `SELFTEST ${ST.length - bad.length}/${ST.length} ` +
    ST.map(s => `${s.ok ? "PASS" : "FAIL"}:${s.name}=${s.detail}`).join(" | ");
  document.body.appendChild(box);
}

/* ---------------- 启动 ---------------- */
const QS = new URLSearchParams(location.search);
const START = clamp((+(QS.get("ch") || 1)) - 1, 0, chapters.length - 1);
const FF = clamp(+(QS.get("ff") || 0), 0, 800);
resize();
go(START);
for (let i = 0; i < FF; i++) chapters[cur].draw && chapters[cur].draw(0, 0.05);
hud.innerHTML = chapters[cur].hud ? chapters[cur].hud() : "";
selfTest();
requestAnimationFrame(t => { last = t; requestAnimationFrame(frame); });
</script>
