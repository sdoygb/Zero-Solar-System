<style>
:root{
  --bg:#070b12; --panel:#0b1220;
  --ink:#e9eef7; --dim:#8b98ad; --faint:#5d6a80;
  --line:rgba(150,175,210,.16); --grid:rgba(150,175,210,.075);
  --acc:#63dcc6; --warm:#e6b45e; --blue:#6fa8dc; --red:#e07a6a; --vio:#a894e8;
  --sans:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,-apple-system,sans-serif;
  --mono:"SF Mono",ui-monospace,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--ink); font-family:var(--sans);
  -webkit-font-smoothing:antialiased; overflow:hidden;
  -webkit-text-size-adjust:100%; text-size-adjust:100%;
  -webkit-tap-highlight-color:transparent;
}
.app{height:100vh; display:grid; grid-template-columns:minmax(0,1fr); grid-template-rows:auto auto minmax(0,1fr) auto;}

/* ---------- header ---------- */
header{
  display:flex; align-items:center; justify-content:space-between;
  padding:12px 22px 10px; border-bottom:1px solid var(--line);
  background:linear-gradient(180deg,#0a101b,#070b12);
}
.brand{display:flex; align-items:center; gap:13px}
.mark-img{
  height:52px; width:auto; display:block;
  filter:drop-shadow(0 2px 14px rgba(0,0,0,.55));
}
h1{font-size:15px; margin:0; letter-spacing:.04em; font-weight:600}
.brand p{margin:2px 0 0; font-size:11.5px; color:var(--dim); letter-spacing:.02em}
.chips{display:flex; gap:6px; flex-wrap:wrap; justify-content:flex-end}
.chip{
  font:500 10.5px/1 var(--mono); color:var(--dim); padding:6px 8px; border-radius:6px;
  border:1px solid var(--line); background:rgba(255,255,255,.015); letter-spacing:.02em;
}

/* ---------- rail ---------- */
nav{display:flex; gap:2px; padding:0 14px; border-bottom:1px solid var(--line); overflow-x:auto}
nav::-webkit-scrollbar{height:0}
.step{
  appearance:none; background:none; border:none; color:var(--faint); cursor:pointer;
  padding:11px 14px 10px; font-family:var(--sans); font-size:12.5px; letter-spacing:.03em;
  border-bottom:2px solid transparent; white-space:nowrap; transition:color .18s,border-color .18s;
}
.step b{font:600 10.5px var(--mono); margin-right:7px; color:var(--faint); transition:color .18s}
.step:hover{color:var(--ink)}
.step.on{color:var(--ink); border-bottom-color:var(--acc)}
.step.on b{color:var(--acc)}

/* ---------- main ---------- */
main{display:grid; grid-template-columns:392px minmax(0,1fr); min-height:0}
aside{
  min-width:0;
  padding:26px 26px 30px; overflow-y:auto; border-right:1px solid var(--line);
  background:linear-gradient(180deg,#0a111c,#080d15);
}
aside::-webkit-scrollbar{width:6px}
aside::-webkit-scrollbar-thumb{background:rgba(150,175,210,.18); border-radius:3px}
.kicker{font:600 10.5px var(--mono); letter-spacing:.16em; color:var(--acc); text-transform:uppercase}
h2{font-size:21px; line-height:1.35; margin:9px 0 14px; font-weight:600; letter-spacing:.01em}
.body p{margin:0 0 11px; font-size:13px; line-height:1.78; color:#c3cddd; overflow-wrap:anywhere}
.body p .mn{font-family:var(--mono); font-size:12px; color:var(--ink); background:rgba(99,220,198,.07); padding:1px 4px; border-radius:4px}
.formula{
  margin:14px 0 16px; padding:13px 14px; border-radius:8px; border:1px solid rgba(99,220,198,.18);
  background:linear-gradient(180deg,rgba(99,220,198,.055),rgba(99,220,198,.015));
  font-family:var(--mono); font-size:12.5px; line-height:1.9; color:#d9f3ee; letter-spacing:.01em;
}
.formula i{font-family:Georgia,"Songti SC",serif; font-style:italic; font-size:14px}
.cites{margin-top:16px; padding-top:12px; border-top:1px dashed var(--line); font:11px/1.7 var(--mono); color:var(--faint)}
table.ledger{width:100%; border-collapse:collapse; margin:6px 0 4px; font-size:11.5px}
table.ledger th{text-align:left; font:500 10px var(--mono); color:var(--faint); padding:5px 4px; border-bottom:1px solid var(--line); letter-spacing:.06em}
table.ledger td{padding:5px 4px; border-bottom:1px solid rgba(150,175,210,.07); color:#b9c4d6}
table.ledger td.t{font-family:var(--mono); font-size:10.5px; white-space:nowrap}
td.d{color:var(--acc)} td.c{color:var(--warm)} td.i{color:var(--blue)} td.a{color:var(--vio)}

/* ---------- stage ---------- */
#stagewrap{position:relative; min-width:0; min-height:0; overflow:hidden;
  background:radial-gradient(1200px 700px at 62% 38%, #0c1524 0%, #070b12 62%)}
#gl,#c2d{position:absolute; top:0; right:0; bottom:0; left:0; width:100%; height:100%; display:block}
#gl{touch-action:none}
#c2d{pointer-events:none}
#stagewrap.mode2d #c2d{pointer-events:auto}
#hud{
  position:absolute; top:16px; right:18px; display:flex; flex-direction:column; gap:1px;
  font-family:var(--mono); font-size:11px; pointer-events:none; z-index:3;
}
.hud-row{display:flex; justify-content:space-between; gap:18px; padding:4px 9px;
  background:rgba(8,13,22,.7); border:1px solid var(--line); border-radius:5px;
  -webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px)}
.hud-row .k{color:var(--faint)}
.hud-row b{color:var(--ink); font-weight:500}
#controls{
  position:absolute; left:0; right:0; bottom:0; padding:34px 18px 14px;
  display:flex; gap:8px; flex-wrap:wrap; align-items:center; z-index:3;
  background:linear-gradient(180deg,rgba(7,11,18,0),rgba(7,11,18,.9) 55%);
}
.ctl{display:flex; align-items:center; gap:8px; padding:5px 10px; border-radius:7px;
  background:rgba(13,20,33,.82); border:1px solid var(--line);
  -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px)}
.ctl label{font-size:11px; color:var(--dim); white-space:nowrap}
.ctl output{font:11px var(--mono); color:var(--ink); min-width:44px; text-align:right}
input[type=range]{
  -webkit-appearance:none; appearance:none; width:104px; height:3px; border-radius:2px;
  background:rgba(150,175,210,.24); outline:none; cursor:pointer;
}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none; width:12px; height:12px; border-radius:50%;
  background:var(--acc); box-shadow:0 0 8px rgba(99,220,198,.5); cursor:grab;
}
input[type=range]::-moz-range-track{height:3px; border-radius:2px; background:rgba(150,175,210,.24)}
input[type=range]::-moz-range-thumb{width:12px; height:12px; border:none; border-radius:50%;
  background:var(--acc); box-shadow:0 0 8px rgba(99,220,198,.5); cursor:grab}
.btn,.tg,.chip2{
  appearance:none; cursor:pointer; font-family:var(--sans); font-size:11.5px;
  color:var(--dim); background:rgba(13,20,33,.82); border:1px solid var(--line);
  padding:7px 11px; border-radius:7px; transition:all .16s; white-space:nowrap;
  -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px);
}
.btn:hover,.tg:hover,.chip2:hover{color:var(--ink); border-color:rgba(150,175,210,.34)}
.tg.on{color:#06120f; background:var(--acc); border-color:var(--acc); font-weight:600}
.chip2.on{color:#1a1204; background:var(--warm); border-color:var(--warm); font-weight:600}
.hint{position:absolute; left:18px; top:16px; font:10.5px/1.6 var(--mono); color:var(--faint);
  max-width:330px; pointer-events:none; z-index:3}
.fallback{
  position:fixed; left:16px; bottom:16px; z-index:999; max-width:430px;
  padding:12px 14px; border-radius:9px; font:12.5px/1.65 var(--sans);
  color:#f3dad5; background:rgba(26,14,14,.96); border:1px solid rgba(224,122,106,.45);
  box-shadow:0 10px 30px rgba(0,0,0,.45);
}

/* ---------- footer ---------- */
footer{
  padding:7px 22px; border-top:1px solid var(--line); color:var(--faint);
  font:10.5px/1.6 var(--mono); display:flex; gap:16px; justify-content:space-between; flex-wrap:wrap;
  background:#070b12;
}

@media (max-width: 980px){
  main{grid-template-columns:minmax(0,1fr); grid-template-rows:minmax(0,34vh) minmax(0,1fr)}
  aside{border-right:none; border-bottom:1px solid var(--line); padding:13px 15px 14px}
  h2{font-size:17px; margin:6px 0 9px}
  .body p{font-size:12.5px; line-height:1.68; margin-bottom:8px}
  .formula{margin:10px 0 12px; padding:10px 11px; font-size:11.5px}
  .cites{font-size:10px; margin-top:10px; padding-top:8px}
  #hud{top:8px; right:8px; font-size:10px}
  .hint{display:none}
  #controls{padding:20px 10px 8px; gap:6px}
  .ctl{padding:4px 7px}
  input[type=range]{width:74px}
  .btn,.tg,.chip2{padding:6px 9px; font-size:11px}
  .chips{display:none}
  footer span:last-child{display:none}
  .mark-img{height:40px}
}
</style>
</head>

<script>

const TAU = Math.PI * 2;

const MONO = '"SF Mono",ui-monospace,Menlo,Consolas,monospace';
const C = {

/* ---------------- 基础工具 ---------------- */

const clamp = (x, a, b) => (x < a ? a : x > b ? b : x);

function fmt(x, n = 2) {
  if (!isFinite(x)) return "—";
  const ax = Math.abs(x);
  if (ax !== 0 && (ax < 1e-3 || ax >= 1e5)) return x.toExponential(1).replace("e+", "e");
  return x.toFixed(n);
}
function fmtSci(x, n = 2) {

function line(x1, y1, x2, y2, color, w = 1, dash = null) {

}

/* ---------------- 控件 ---------------- */
function range(o) {

/* ================================================================
   3D 基建
   ================================================================ */
let renderer = null;
try {
  renderer = new THREE.WebGLRenderer({ canvas: glc, antialias: true, alpha: true });
  renderer.setClearColor(0x000000, 0);
} catch (e) {

}
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(46, 1, 0.02, 8000);

const glowTexCache = {};
function glowTex() {
  if (glowTexCache.t) return glowTexCache.t;
  const c = document.createElement("canvas");
  c.width = c.height = 128;
  const g = c.getContext("2d");
  const gr = g.createRadialGradient(64, 64, 0, 64, 64, 64);
  gr.addColorStop(0, "rgba(255,255,255,1)");
  gr.addColorStop(.22, "rgba(255,255,255,.6)");
  gr.addColorStop(.5, "rgba(255,255,255,.16)");
  gr.addColorStop(1, "rgba(255,255,255,0)");
  g.fillStyle = gr; g.fillRect(0, 0, 128, 128);
  const t = new THREE.CanvasTexture(c);
  t.needsUpdate = true;
  glowTexCache.t = t;
  return t;
}
function glow(color, size, opacity = 1) {
  const s = new THREE.Sprite(new THREE.SpriteMaterial({
    map: glowTex(), color, transparent: true, opacity,
    blending: THREE.AdditiveBlending, depthWrite: false,
  }));
  s.scale.set(size, size, 1);
  return s;
}
function labelSprite(str, color = "#dfe8f5", size = 1) {
  const c = document.createElement("canvas");
  c.width = 320; c.height = 80;
  const g = c.getContext("2d");
  g.font = '500 46px "PingFang SC","Hiragino Sans GB",sans-serif';
  g.fillStyle = color; g.textAlign = "center"; g.textBaseline = "middle";
  g.fillText(str, 160, 40);
  const tex = new THREE.CanvasTexture(c);
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, depthWrite: false, depthTest: false }));
  sp.userData.txt = str.length;
  sp.userData.size = size;
  sp.scale.set(3 * size, 0.75 * size, 1);
  sp.userData.fit = (d) => {
    const k = (sp.userData.txt > 6 ? 0.10 : 0.13) * d * sp.userData.size;
    sp.scale.set(k, k * 0.25, 1);
  };
  return sp;
}
function vec3(x, y, z) { return new THREE.Vector3(x, y, z); }
function lineLoop(points, color, opacity = 1) {
  const geo = new THREE.BufferGeometry().setFromPoints(points);
  return new THREE.Line(geo, new THREE.LineBasicMaterial({ color, transparent: opacity < 1, opacity }));
}
function circlePoints(r, n = 128, plane = "xz") {
  const pts = [];
  for (let i = 0; i <= n; i++) {
    const a = (i / n) * TAU;
    pts.push(plane === "xz" ? vec3(Math.cos(a) * r, 0, Math.sin(a) * r)
      : vec3(Math.cos(a) * r, Math.sin(a) * r, 0));
  }
  return pts;
}
function clearScene() {
  while (scene.children.length) {
    const o = scene.children[0];
    o.traverse && o.traverse(c => { if (c.geometry) c.geometry.dispose(); });
    scene.remove(o);
  }
}

/* ---------------- 轨道相机（旋转 / 缩放 / 平移） ---------------- */
const ctrl = {
  r: 8, theta: 0.6, phi: 1.15, target: new THREE.Vector3(),
  minR: 0.3, maxR: 2000, dragging: false, panning: false, grabbing: false,
  chapter: null, pointers: new Map(), lastPinch: 0, lastMid: null,
  reset(o) {
    this.r = o.r; this.theta = o.theta ?? 0.6; this.phi = o.phi ?? 1.15;
    this.target.set(0, 0, 0);
    if (o.target) this.target.set(o.target[0], o.target[1], o.target[2]);
    this.minR = o.minR ?? o.r * 0.08;
    this.maxR = o.maxR ?? o.r * 12;
  },
  apply() {
    const sp = Math.sin(this.phi), cp = Math.cos(this.phi);
    camera.position.set(
      this.target.x + this.r * sp * Math.sin(this.theta),
      this.target.y + this.r * cp,
      this.target.z + this.r * sp * Math.cos(this.theta)
    );
    camera.lookAt(this.target);
  },
  panScale() { return 2 * Math.tan((camera.fov * Math.PI / 180) / 2) * this.r / H; },
  down(ev) {
    const ch = this.chapter;
    if (ch && ch.canGrab && ch.canGrab(ev)) {
      this.grabbing = true;
      ch.grabStart(ev);
      return;
    }
    this.pointers.set(ev.pointerId, { x: ev.clientX, y: ev.clientY });
    if (this.pointers.size === 2) {
      const [a, b] = [...this.pointers.values()];
      this.lastPinch = Math.hypot(a.x - b.x, a.y - b.y);
      this.lastMid = { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
      return;
    }
    this.dragging = true;
    this.panning = ev.shiftKey || ev.button === 2;
    this.lastX = ev.clientX; this.lastY = ev.clientY;
  },
  move(ev) {
    if (this.grabbing && this.chapter && this.chapter.grabMove) { this.chapter.grabMove(ev); return; }
    if (this.pointers.has(ev.pointerId)) this.pointers.set(ev.pointerId, { x: ev.clientX, y: ev.clientY });
    if (this.pointers.size === 2) {
      const [a, b] = [...this.pointers.values()];
      const d = Math.hypot(a.x - b.x, a.y - b.y);
      const mid = { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
      if (this.lastPinch) this.r = clamp(this.r * (this.lastPinch / d), this.minR, this.maxR);
      if (this.lastMid) this.panPixels(mid.x - this.lastMid.x, mid.y - this.lastMid.y);
      this.lastPinch = d; this.lastMid = mid;
      return;
    }
    if (!this.dragging) return;
    const dx = ev.clientX - this.lastX, dy = ev.clientY - this.lastY;
    this.lastX = ev.clientX; this.lastY = ev.clientY;
    if (this.panning) this.panPixels(dx, dy);
    else {
      this.theta -= dx * 0.006;
      this.phi = clamp(this.phi - dy * 0.006, 0.05, Math.PI - 0.05);
    }
  },
  panPixels(dx, dy) {
    const k = this.panScale();
    const right = new THREE.Vector3().setFromMatrixColumn(camera.matrix, 0);
    const up = new THREE.Vector3().setFromMatrixColumn(camera.matrix, 1);
    this.target.addScaledVector(right, -dx * k).addScaledVector(up, dy * k);
  },
  up(ev) {
    if (this.grabbing && this.chapter && this.chapter.grabEnd) {
      this.grabbing = false;
      this.chapter.grabEnd(ev);
      return;
    }
    this.pointers.delete(ev.pointerId);
    if (this.pointers.size < 2) { this.lastPinch = 0; this.lastMid = null; }
    this.dragging = false;
    this.panning = false;
  },
};

function onDown(ev) {
  if (!cur3D || !renderer) return;
  glc.setPointerCapture(ev.pointerId);
  ctrl.down(ev);
}
function onMove(ev) { if (cur3D && renderer) ctrl.move(ev); }
function onUp(ev) { if (cur3D && renderer) ctrl.up(ev); }
function onWheel(ev) {
  if (!cur3D || !renderer) return;
  ev.preventDefault();
  ctrl.r = clamp(ctrl.r * Math.exp(ev.deltaY * 0.0012), ctrl.minR, ctrl.maxR);

glc.addEventListener("pointerdown", onDown);
glc.addEventListener("pointermove", onMove);
glc.addEventListener("pointerup", onUp);
glc.addEventListener("pointercancel", onUp);
glc.addEventListener("wheel", onWheel, { passive: false });
glc.addEventListener("contextmenu", e => e.preventDefault());
glc.addEventListener("dblclick", () => ctrl.reset(chapters[cur].cam));

/* ================================================================
   第 1 步：格点与势（3D 点云）
   ================================================================ */
function makeCh1() {
  const N = 32, NN = N * N * N, c = N >> 1, SUB = 2, M = N / SUB;
  let A = new Float32Array(NN), B = new Float32Array(NN);
  const Q = new Float32Array(NN);
  let shell = [], iters = 0, residual = 1, running = true, fitA = 0, fitC = 0;
  let colorAttr = null, posAttr = null;
  const idx = (x, y, z) => x + N * (y + N * z);

  function reset() {
    A.fill(0); B.fill(0); Q.fill(0);
    Q[idx(c, c, c)] = 1;
    shell = [];
    for (let z = 0; z < N; z++) for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
      const dx = Math.min(x, N - x), dy = Math.min(y, N - y), dz = Math.min(z, N - z);
      const r = Math.sqrt(dx * dx + dy * dy + dz * dz);
      if (r > 11.4 && r < 12.6) shell.push(idx(x, y, z));
    }
    for (const i of shell) Q[i] = -1 / shell.length;
    iters = 0; residual = 1; running = true;
  }

  function step(n) {
    for (let s = 0; s < n; s++) {
      for (let z = 0; z < N; z++) {
        const zm = (z + N - 1) % N, zp = (z + 1) % N;
        const o0 = N * N * zm, o1 = N * N * zp, zb = N * N * z;
        for (let y = 0; y < N; y++) {
          const ym = (y + N - 1) % N, yp = (y + 1) % N;
          const base = N * y + zb;
          const iy0 = N * ym + zb, iy1 = N * yp + zb;
          const iz0 = o0 + N * y, iz1 = o1 + N * y;
          for (let x = 0; x < N; x++) {
            const xm = (x + N - 1) % N, xp = (x + 1) % N;
            const i = base + x;
            const J = (A[iy0 + x] + A[iy1 + x] + A[base + xm] + A[base + xp]
              + A[iz0 + x] + A[iz1 + x] - Q[i]) / 6;
            B[i] = 0.15 * A[i] + 0.85 * J;
          }
        }
      }
      const t = A; A = B; B = t;
      iters++;
    }
    let m = 0;
    for (let i = 0; i < NN; i += 173) {
      const z = (i / (N * N)) | 0, y = ((i / N) | 0) % N, x = i % N;
      const xm = (x + N - 1) % N, xp = (x + 1) % N;
      const ym = (y + N - 1) % N, yp = (y + 1) % N;
      const zm = (z + N - 1) % N, zp = (z + 1) % N;
      const lap = 6 * A[i] - A[idx(xm, y, z)] - A[idx(xp, y, z)] - A[idx(x, ym, z)]
        - A[idx(x, yp, z)] - A[idx(x, y, zm)] - A[idx(x, y, zp)];
      m = Math.max(m, Math.abs(lap + Q[i]));
    }
    residual = m;
    let cnt = 0, sx = 0, sy = 0, sxx = 0, sxy = 0;
    for (let r = 5; r <= 9; r++) {
      const v = A[idx(c + r, c, c)], u = 1 / r;
      cnt++; sx += u; sy += v; sxx += u * u; sxy += u * v;
    }
    const den = cnt * sxx - sx * sx;
    fitA = (cnt * sxy - sx * sy) / den;
    fitC = (sy - fitA * sx) / cnt;
  }

  function paintColors() {
    if (!colorAttr) return;
    const col = colorAttr.array;
    const norm = (1 / (4 * Math.PI)) * 1.15;
    let k = 0;
    for (let a = 0; a < M; a++) for (let b = 0; b < M; b++) for (let d = 0; d < M; d++) {
      const v = A[idx(d * SUB, b * SUB, a * SUB)];
      let t = clamp(-v / norm, 0, 1);
      t = Math.pow(t, 1.15);
      col[k++] = 0.10 + 0.35 * t;
      col[k++] = 0.25 + 0.62 * t;
      col[k++] = 0.30 + 0.52 * t;
    }
    colorAttr.needsUpdate = true;
  }

  function build() {
    clearScene();
    const pos = [];
    for (let a = 0; a < M; a++) for (let b = 0; b < M; b++) for (let d = 0; d < M; d++) {
      pos.push(d * SUB - c, b * SUB - c, a * SUB - c);
    }
    const geo = new THREE.BufferGeometry();
    posAttr = new THREE.Float32BufferAttribute(pos, 3);
    geo.setAttribute("position", posAttr);
    colorAttr = new THREE.Float32BufferAttribute(new Float32Array(pos.length), 3);
    geo.setAttribute("color", colorAttr);
    const mat = new THREE.PointsMaterial({
      size: 0.66, vertexColors: true, map: glowTex(), alphaTest: 0.01,
      transparent: true, opacity: 0.85,
      blending: THREE.AdditiveBlending, depthWrite: false, sizeAttenuation: true,
    });
    scene.add(new THREE.Points(geo, mat));

    const src = new THREE.Mesh(new THREE.SphereGeometry(0.5, 18, 12),
      new THREE.MeshBasicMaterial({ color: 0xfff2cf }));
    scene.add(src);
    const g = glow(0xffd489, 7); scene.add(g);

    [0, 1, 2].forEach(k => {
      const pts = [];
      for (let i = 0; i <= 128; i++) {
        const a = (i / 128) * TAU;
        if (k === 0) pts.push(vec3(Math.cos(a) * 12, Math.sin(a) * 12, 0));
        else if (k === 1) pts.push(vec3(Math.cos(a) * 12, 0, Math.sin(a) * 12));
        else pts.push(vec3(0, Math.cos(a) * 12, Math.sin(a) * 12));
      }
      scene.add(lineLoop(pts, 0xe6b45e, 0.10));
    });

    // 参考轴
    const ax = new THREE.LineSegments(
      new THREE.BufferGeometry().setFromPoints([
        vec3(-13, 0, 0), vec3(13, 0, 0), vec3(0, -13, 0), vec3(0, 13, 0), vec3(0, 0, -13), vec3(0, 0, 13),
      ]),
      new THREE.LineBasicMaterial({ color: 0x4a6a88, transparent: true, opacity: 0.10 }));
    scene.add(ax);

    paintColors();
    ctrl.reset({ r: 48, theta: 0.7, phi: 1.05, minR: 6, maxR: 200 });
  }

  reset();

  return {
    is3D: true,
    kicker: "第 1 步 · 舞台与源",
    title: "长程势：1/r 是解，不是假设",
    body: `
      <p>Zero 的舞台是一张格点（Zb006：舞台是输入）。把源写成格点上的荷 <span class="mn">x</span>，
      势 <span class="mn">φ</span> 由离散泊松方程定下来，<span class="mn">L = BBᵀ</span>。</p>
      <div class="formula">L<i>φ</i> = −<i>x</i>，&nbsp;&nbsp;L = BB<sup>T</sup></div>
      <p>它有解当且仅当总荷为零（Zb012 定理 1.2）。这不是额外假设——它和守恒律同源。
      所以画面里的 +1 源必须配一圈等量的负电荷。</p>
      <p>三维各向同性舞台上，点源的格林函数在 r ≫ a 时是
      <span class="mn">G ~ 1/(4πσr)</span>，σ 由键几何给出（定理 3.1）。
      <b>1/r 的形状来自维数，幅度来自舞台</b>——不是外加的力律。</p>`,
    cites: "Zb012 定理 1.2 · 定理 3.1 ｜ 32³ 周期格，实时 Jacobi 松弛",
    hint: "拖动旋转 · 滚轮缩放 · Shift+拖动平移。点云是过源心的势场（每 2 格取样）。",
    cam: { r: 48, theta: 0.7, phi: 1.05, minR: 6, maxR: 200 },
    build,
    update(dt) {
      if (running && iters < 60000 && residual > 2e-8) step(26);
      paintColors();
    },
    hud: () => hudRows([
      ["迭代", iters.toLocaleString()],
      ["残差 (max)", fmtSci(residual, 1)],
      ["4π|A|（拟合）", fmt(Math.abs(4 * Math.PI * fitA), 3)],
      ["连续值", "1.000"],
    ]),
    controls(root) {
      root.append(button("重新松弛", () => reset()),
        toggle("暂停", false, v => { running = !v; }),
        viewBtn());
    },
    chart() {
      const px = W - 318, py = 250, pw = 282, ph = 186;
      if (pw < 120) return;
      ctx.save();
      ctx.fillStyle = "rgba(8,13,22,.72)";
      ctx.strokeStyle = C.line;
      ctx.beginPath(); ctx.rect(px - 10, py - 30, pw + 20, ph + 44); ctx.fill(); ctx.stroke();
      ctx.restore();
      text("φ 对 1/r：一条直线", px, py - 14, { size: 11.5, color: C.ink });
      let vmin = 0;
      for (let r = 2; r <= 12; r++) vmin = Math.min(vmin, A[idx(c + r, c, c)]);
      vmin *= 1.08;
      const smax = 1 / 2.2, smin = 1 / 12.6;
      const X = u => px + ((u - smin) / (smax - smin)) * pw;
      const Y = v => py + ph - ((v - vmin) / (0 - vmin)) * ph;
      line(px, py + ph, px + pw, py + ph, C.line);
      line(px, py, px, py + ph, C.line);
      ctx.save(); ctx.beginPath();
      ctx.moveTo(X(smin), Y(fitA * smin + fitC));
      ctx.lineTo(X(smax), Y(fitA * smax + fitC));
      ctx.strokeStyle = C.acc; ctx.globalAlpha = .8; ctx.lineWidth = 1.2;
      ctx.setLineDash([4, 4]); ctx.stroke(); ctx.restore();
      for (let r = 2; r <= 11; r++) dot(X(1 / r), Y(A[idx(c + r, c, c)]), 2.6, C.warm);
      text("1/r", px + pw, py + ph + 14, { size: 9, mono: true, color: C.faint, align: "right" });
      text(`4π|A| = ${fmt(Math.abs(4 * Math.PI * fitA), 3)}`, px + 2, py + 10, { size: 10, mono: true, color: C.dim });
    },
  };
}

      <p>指数 2 不是拟合的，是三维格林函数的导数（Zb051 定理 1.2）。换成二维舞台会得到 1/r，换成四维会得到 1/r³——<b>指数由维数定</b>。</p>

/* ================================================================
   第 3 步：轨道（太阳系 / 单星）
   ================================================================ */
function makeCh3() {
  let mode = "system";
  let tYear = 0, playing = true, speed = 1.2, autoSlow = true, camK = 1;
  let sunMesh = null, planetMeshes = [], planetLabels = [], orbitGroups = [];
  let single = null;          // 单星场景对象
  const S = { p: { x: 0.72, z: 0 }, v: { x: 0, z: 0 }, trail: [], acc: 0, lat: false, ratio: 12, alat: 0.72, running: true };
  let dragging = null, trailLine = null, planetMesh = null, orbitLine = null, sectorsMesh = null, dragPreview = null;
  let timeInp = null, timeOut = null;

  function orbitPos(p, t) {
    const M = p.m0 * Math.PI / 180 + TAU * t / p.T;
    let E = M;
    for (let k = 0; k < 6; k++) E -= (E - p.e * Math.sin(E) - M) / (1 - p.e * Math.cos(E));
    const nu = 2 * Math.atan2(Math.sqrt(1 + p.e) * Math.sin(E / 2), Math.sqrt(1 - p.e) * Math.cos(E / 2));
    const r = p.a * (1 - p.e * Math.cos(E));
    const th = nu + p.w * Math.PI / 180;
    const inc = p.inc * Math.PI / 180;
    const x = r * Math.cos(th), zz = r * Math.sin(th);
    return vec3(x, zz * Math.sin(inc), zz * Math.cos(inc));
  }

  function buildSystem() {
    clearScene();
    planetMeshes = []; planetLabels = []; orbitGroups = [];
    sunMesh = new THREE.Mesh(new THREE.SphereGeometry(0.3, 24, 16),
      new THREE.MeshBasicMaterial({ color: 0xffe6ae }));
    scene.add(sunMesh);
    scene.add(glow(0xffc061, 5.5, 0.9));

    D.planets.forEach((p, i) => {
      const g = new THREE.Group();
      const pts = [];
      for (let k = 0; k <= 360; k++) {
        const M = (k / 360) * TAU;
        let E = M;
        for (let it = 0; it < 5; it++) E -= (E - p.e * Math.sin(E) - M) / (1 - p.e * Math.cos(E));
        const nu = 2 * Math.atan2(Math.sqrt(1 + p.e) * Math.sin(E / 2), Math.sqrt(1 - p.e) * Math.cos(E / 2));
        const r = p.a * (1 - p.e * Math.cos(E));
        const th = nu + p.w * Math.PI / 180;
        pts.push(vec3(r * Math.cos(th), 0, r * Math.sin(th)));
      }
      const inc = p.inc * Math.PI / 180;
      const line = lineLoop(pts, new THREE.Color(p.color).multiplyScalar(0.55), 0.5);
      line.rotation.x = -inc;
      scene.add(line);
      orbitGroups.push(line);

      const mesh = new THREE.Mesh(new THREE.SphereGeometry(1, 20, 14),
        new THREE.MeshStandardMaterial({
          color: new THREE.Color(p.color), roughness: 0.85, metalness: 0.0,
          emissive: new THREE.Color(p.color).multiplyScalar(0.12),
        }));
      mesh.scale.setScalar(p.rv * 1.75);
      scene.add(mesh);
      planetMeshes.push(mesh);

      const lab = labelSprite(p.name, new THREE.Color(p.color).getStyle(), 0.9);
      scene.add(lab);
      planetLabels.push(lab);
    });

    // 黄道参考网格
    [1, 3, 10, 30].forEach(r => {
      scene.add(lineLoop(circlePoints(r, 128), 0x3b5a78, 0.18));
    });
    for (let k = 0; k < 12; k++) {
      const a = (k / 12) * TAU;
      scene.add(lineLoop([vec3(0, 0, 0), vec3(Math.cos(a) * 32, 0, Math.sin(a) * 32)], 0x3b5a78, 0.08));
    }

    const lights = new THREE.Group();
    lights.add(new THREE.AmbientLight(0xffffff, 0.55));
    const pl = new THREE.PointLight(0xfff0d8, 1.5, 0, 0);
    lights.add(pl);
    const dl = new THREE.DirectionalLight(0x88aaff, 0.35);
    dl.position.set(-1, 2, 1);
    lights.add(dl);
    scene.add(lights);
    planetMeshes.forEach(m => m.userData.ok = true);
  }

  function buildSingle() {
    clearScene();
    const sun = new THREE.Mesh(new THREE.SphereGeometry(0.05, 20, 14),
      new THREE.MeshBasicMaterial({ color: 0xffe9bd }));
    scene.add(sun);
    scene.add(glow(0xffc061, 0.55, 0.95));

    const grid = new THREE.Group();
    [0.5, 1, 2, 5].forEach(r => grid.add(lineLoop(circlePoints(r, 128), 0x3b5a78, 0.16)));
    scene.add(grid);

    sectorsMesh = new THREE.Mesh(new THREE.BufferGeometry(),
      new THREE.MeshBasicMaterial({ vertexColors: true, transparent: true, opacity: 0.15, side: THREE.DoubleSide, depthWrite: false }));
    scene.add(sectorsMesh);

    orbitLine = new THREE.Line(new THREE.BufferGeometry(),
      new THREE.LineDashedMaterial({ color: 0x63dcc6, transparent: true, opacity: 0.45, dashSize: 0.04, gapSize: 0.04 }));
    scene.add(orbitLine);

    const trailGeo = new THREE.BufferGeometry();
    trailGeo.setAttribute("position", new THREE.BufferAttribute(new Float32Array(3000 * 3), 3));
    trailGeo.setDrawRange(0, 0);
    trailLine = new THREE.Line(trailGeo, new THREE.LineBasicMaterial({ color: 0xeaf0fa, transparent: true, opacity: 0.7 }));
    scene.add(trailLine);

    planetMesh = new THREE.Mesh(new THREE.SphereGeometry(0.028, 16, 12),
      new THREE.MeshBasicMaterial({ color: 0x8fd3ff }));
    scene.add(planetMesh);
    planetMesh.add(glow(0x6fc8ff, 0.22, 0.9));

    dragPreview = new THREE.Line(new THREE.BufferGeometry().setFromPoints([vec3(0, 0, 0), vec3(0, 0, 0)]),
      new THREE.LineDashedMaterial({ color: 0xe6b45e, dashSize: 0.05, gapSize: 0.05, transparent: true, opacity: 0.9 }));
    dragPreview.visible = false;
    scene.add(dragPreview);

    const lights = new THREE.Group();
    lights.add(new THREE.AmbientLight(0xffffff, 0.8));
    scene.add(lights);

    S.trail.length = 0;
    S.acc = 0;
    launch(0.72, 1, false);
    ctrl.reset({ r: 3.4, theta: 0.5, phi: 1.12, minR: 0.5, maxR: 30 });
  }

  function launch(r, f, reset = true) {
    S.p = { x: r, z: 0 };
    S.v = { x: 0, z: Math.sqrt(GM / r) * f };
    S.alat = r / S.ratio;
    S.trail.length = 0;
    S.acc = 0;
    if (reset) {
      const g = geom();
      if (g.e < 1 && g.a > 0) ctrl.reset({ r: Math.min(9, 2.6 * g.a * (1 + g.e) + 0.6), theta: ctrl.theta, phi: 1.12, minR: 0.4, maxR: 60 });
    }
  }

  function geom() {
    const r = Math.hypot(S.p.x, S.p.z);
    const v2 = S.v.x * S.v.x + S.v.z * S.v.z;
    const h = S.p.x * S.v.z - S.p.z * S.v.x;
    const rv = S.p.x * S.v.x + S.p.z * S.v.z;
    const ex = ((v2 - GM / r) * S.p.x - rv * S.v.x) / GM;
    const ez = ((v2 - GM / r) * S.p.z - rv * S.v.z) / GM;
    const e = Math.hypot(ex, ez);
    const a = 1 / (2 / r - v2 / GM);
    const pl = h * h / GM;
    return { r, v2, h, e, a, pl, om: Math.atan2(ez, ex), T: a > 0 ? TAU * Math.sqrt(a * a * a / GM) : Infinity };
  }

  function accel(p, out) {
    const r2 = p.x * p.x + p.z * p.z, r = Math.sqrt(r2);
    const th = Math.atan2(p.z, p.x);
    let ar = -GM / r2, at = 0;
    if (S.lat) {
      const q = Math.pow(S.alat / r, 2), c4 = 1.1;
      ar *= 1 + 3 * c4 * q * Math.cos(4 * th);
      at = -4 * c4 * q * Math.sin(4 * th) * GM / r2;
    }
    out.x = ar * Math.cos(th) - at * Math.sin(th);
    out.z = ar * Math.sin(th) + at * Math.cos(th);
    return out;
  }

  const tmpA = { x: 0, z: 0 };
  function step2(dt) {
    accel(S.p, tmpA);
    S.v.x += tmpA.x * dt / 2; S.v.z += tmpA.z * dt / 2;
    S.p.x += S.v.x * dt; S.p.z += S.v.z * dt;
    accel(S.p, tmpA);
    S.v.x += tmpA.x * dt / 2; S.v.z += tmpA.z * dt / 2;
  }

  function trailPush() {
    const arr = trailLine.geometry.attributes.position.array;
    const n = Math.min(3000, S.trail.length);
    for (let i = 0; i < n; i++) {
      arr[i * 3] = S.trail[i].x;
      arr[i * 3 + 1] = 0;
      arr[i * 3 + 2] = S.trail[i].z;
    }
    trailLine.geometry.attributes.position.needsUpdate = true;
    trailLine.geometry.setDrawRange(0, n);
  }

  function updateSingle(dt) {
    if (S.running) {
      S.acc += 0.17 * 1 * dt;
      let n = 0;
      while (S.acc > 0 && n < 900) {
        const r0 = Math.hypot(S.p.x, S.p.z);
        const h = clamp(1.1e-4 * Math.pow(Math.max(r0, 0.08), 1.5), 2e-5, 4e-4);
        const dd = Math.min(h, S.acc);
        step2(dd); S.acc -= dd; n++;
        const last = S.trail[S.trail.length - 1];
        if (!last || Math.hypot(S.p.x - last.x, S.p.z - last.z) > 0.002) {
          S.trail.push({ x: S.p.x, z: S.p.z });
          if (S.trail.length > 3000) S.trail.shift();
        }
      }
      const g = geom();
      if (g.r > 40) launch(0.72, 1, false);
    }
    planetMesh.position.set(S.p.x, 0, S.p.z);
    trailPush();

    // 解析圆锥 + 扇形
    const g = geom();
    const pts = [];
    const lim = g.e < 1 ? Math.PI : Math.acos(-1 / g.e) - 0.02;
    for (let i = -180; i <= 180; i++) {
      const nu = (i / 180) * lim;
      const den = 1 + g.e * Math.cos(nu);
      if (den < 0.02) continue;
      const rr = g.pl / den;
      pts.push(vec3(Math.cos(nu + g.om) * rr, 0, Math.sin(nu + g.om) * rr));
    }
    orbitLine.geometry.dispose();
    orbitLine.geometry = new THREE.BufferGeometry().setFromPoints(pts);
    orbitLine.computeLineDistances();

    sectorsMesh.visible = (g.e < 1 && g.a > 0 && !S.lat);
    if (sectorsMesh.visible) {
      const verts = [], idxs = [], cols = [];
      for (let k = 0; k < 8; k++) {
        const M0 = (k / 8) * TAU, M1 = ((k + 1) / 8) * TAU;
        const E0 = solveE(M0, g.e), E1 = solveE(M1, g.e);
        const nu0 = 2 * Math.atan2(Math.sqrt(1 + g.e) * Math.sin(E0 / 2), Math.sqrt(1 - g.e) * Math.cos(E0 / 2));
        const nu1 = 2 * Math.atan2(Math.sqrt(1 + g.e) * Math.sin(E1 / 2), Math.sqrt(1 - g.e) * Math.cos(E1 / 2));
        const base = verts.length / 3;
        const col = k % 2 ? [0.35, 0.84, 0.77] : [0.9, 0.71, 0.37];
        verts.push(0, 0, 0);
        cols.push(...col);
        for (let i = 0; i <= 12; i++) {
          const nu = nu0 + (nu1 - nu0) * (i / 12);
          const rr = g.pl / (1 + g.e * Math.cos(nu));
          verts.push(Math.cos(nu + g.om) * rr, 0, Math.sin(nu + g.om) * rr);
          cols.push(...col);
        }
        for (let i = 0; i < 12; i++) idxs.push(base, base + 1 + i, base + 2 + i);
      }
      const geo = new THREE.BufferGeometry();
      geo.setAttribute("position", new THREE.Float32BufferAttribute(verts, 3));
      geo.setAttribute("color", new THREE.Float32BufferAttribute(cols, 3));
      geo.setIndex(idxs);
      sectorsMesh.geometry.dispose();
      sectorsMesh.geometry = geo;
      sectorsMesh.material.opacity = 0.1;
    }
  }

  function solveE(M, e) {
    let E = M;
    for (let i = 0; i < 8; i++) E -= (E - e * Math.sin(E) - M) / (1 - e * Math.cos(E));
    return E;
  }

  function updateSystem(dt) {
    // 随镜头减速：镜头越近，时间走得越慢，近处行星才看得清
    camK = autoSlow ? clamp(Math.pow(ctrl.r / 48, 1.4), 0.03, 1) : 1;
    if (playing) {
      tYear += dt * speed * camK;
      if (timeInp) timeInp.value = clamp(tYear, 0, 240);
      if (timeOut) timeOut.textContent = fmt(tYear, 1);
    }
    const dCam = camera.position.distanceTo(ctrl.target);
    const dirCam = camera.getWorldDirection(new THREE.Vector3());
    const focal = (H / 2) / Math.tan(camera.fov * Math.PI / 360);
    D.planets.forEach((p, i) => {
      const pos = orbitPos(p, tYear);
      planetMeshes[i].position.copy(pos);
      const lab = planetLabels[i];
      lab.position.copy(pos).add(vec3(0, p.rv * 1.75 + 1.6, 0));
      lab.userData.fit(dCam);
      const rel = new THREE.Vector3().subVectors(lab.position, camera.position);
      const distCam = rel.length();
      const ahead = rel.dot(dirCam);
      const screenH = (lab.scale.y / Math.max(0.001, distCam)) * focal;
      lab.visible = ahead > 0.2 && screenH > 11 && distCam < 2.5 * dCam + 4 && !(dCam > 34 && p.a < 1.6);
    });
    sunMesh.rotation.y += dt * 0.2;
  }

  function rebuild() {
    if (mode === "system") buildSystem(); else buildSingle();
  }

  return {
    is3D: true,
    kicker: "第 3 步 · 中心力",
    title: "为什么是椭圆：角动量 + Binet",
    body: `
      <p>力始终指向源。于是 <span class="mn">L = m r × ṙ</span> 守恒，轨道落在一个平面内；
      面积速度 <span class="mn">dA/dt = L/2m</span> 恒定（Zb051 定理 3.1–3.2）。</p>
      <p>令 <span class="mn">u = 1/r</span>，Binet 方程给出 <span class="mn">u″ + u = κm²/L²</span>，
      通解 <span class="mn">u = (κm²/L²)(1 + e cos θ)</span>——圆锥曲线（定理 4.2–4.3）。</p>
      <div class="formula"><i>r</i> = <i>p</i> / (1 + <i>e</i> cos θ)，&nbsp;&nbsp;<i>T</i>² = (4π²/κ) <i>a</i>³</div>
      <p><b>e、相位、轨道尺度 a 都是积分常数，也就是初值。</b>本篇给"给定初值，轨道必是这个形状"，
      不给"初值为什么是这些"。</p>
      <p>太阳系视图里，八颗行星的 a、e、i 用 JPL 近似值（J2000 历元）；行星大小按可见性放缩，不是真实比例。</p>`,
    cites: "Zb051 定理 3.1 / 3.2 / 4.2 / 4.3 / 5.1 ｜ 虚线：解析圆锥；实线：数值积分",
    hint: "拖动旋转 · 滚轮缩放。拉近太阳时时间会自动变慢；切到「单星」可抓住行星甩出去。",
    cam: { r: 48, theta: 0.5, phi: 1.02, minR: 1.2, maxR: 900 },
    get camNow() { return mode === "system" ? { r: 48, theta: 0.5, phi: 1.02, minR: 1.2, maxR: 900 } : { r: 3.4, theta: 0.5, phi: 1.12, minR: 0.4, maxR: 60 }; },
    build() {
      if (!S.v.z) S.v.z = 1;
      if (QS.get("mode") === "single") mode = "single";
      if (QS.get("mode") === "system") mode = "system";
      rebuild();
    },
    update(dt) { if (mode === "system") updateSystem(dt); else updateSingle(dt); },
    hud: () => {
      if (mode === "system") {
        return hudRows([
          ["历元 t", `${fmt(tYear, 1)} 年`],
          ["时间倍率", autoSlow ? `×${fmt(camK, 2)}` : "×1.00（固定）"],
          ["播放", playing ? "是" : "否"],
          ["行星", `${D.planets.length}`],
        ]);
      }
      const g = geom();
      return hudRows([
        ["e", fmt(g.e, 3)],
        ["a (AU)", isFinite(g.a) ? fmt(g.a, 3) : "∞"],
        ["T (yr)", isFinite(g.T) ? fmt(g.T, 2) : "—"],
        ["r (AU)", fmt(g.r, 3)],
      ]);
    },
    controls(root) {
      const mBtnS = button("太阳系", () => { mode = "system"; playing = true; buildSystem(); ctrl.reset(this.camNow); sync(); }, "chip2" + (mode === "system" ? " on" : ""));
      const mBtn1 = button("单星（拖拽）", () => { mode = "single"; buildSingle(); ctrl.reset(this.camNow); sync(); }, "chip2" + (mode === "single" ? " on" : ""));
      const sync = () => {
        mBtnS.classList.toggle("on", mode === "system");
        mBtn1.classList.toggle("on", mode === "single");
        row2.style.display = mode === "single" ? "flex" : "none";
        row1.style.display = mode === "system" ? "flex" : "none";
      };
      const row1 = el("div", "ctl");
      row1.style.gap = "8px";
      timeOut = el("output", null, "0.0");
      timeInp = range({
        min: 0, max: 240, step: 1, value: 0,
        onInput: v => { tYear = v; timeOut.textContent = fmt(v, 1); },
      });
      row1.append(el("label", null, "历元"), timeInp, timeOut,
        toggle("播放", true, v => { playing = v; }),
        toggle("随镜头减速", true, v => { autoSlow = v; }));
      row1.style.background = "transparent";
      row1.style.border = "none";
      row1.style.padding = "0";

      const row2 = el("div", "ctl");
      row2.style.gap = "8px";
      row2.append(
        button("圆", () => launch(0.72, 1), "chip2"),
        button("椭圆", () => launch(0.72, 0.78), "chip2"),
        button("抛物线", () => launch(0.72, 1.414), "chip2"),
        button("双曲线", () => launch(0.72, 1.45), "chip2"),
        toggle("格距修正", false, v => { S.lat = v; }),
        ctl("r/a", range({
          min: 5, max: 30, step: 1, value: 12,
          onInput: v => { S.ratio = v; S.alat = Math.hypot(S.p.x, S.p.z) / v; S.trail.length = 0; },
        })),
      );
      row2.style.background = "transparent";
      row2.style.border = "none";
      row2.style.padding = "0";

      root.append(mBtnS, mBtn1, row1, row2, viewBtn());
      sync();
    },
    canGrab(ev) {
      if (mode !== "single") return false;
      const p = vec3(S.p.x, 0, S.p.z).project(camera);
      const sx = (p.x * 0.5 + 0.5) * W, sy = (-p.y * 0.5 + 0.5) * H;
      const r = stage.getBoundingClientRect();
      return Math.hypot(ev.clientX - r.left - sx, ev.clientY - r.top - sy) < 30;
    },
    grabStart(ev) {
      const r = stage.getBoundingClientRect();
      const ray = new THREE.Raycaster();
      const ndc = new THREE.Vector2(((ev.clientX - r.left) / W) * 2 - 1, -((ev.clientY - r.top) / H) * 2 + 1);
      ray.setFromCamera(ndc, camera);
      const hit = new THREE.Vector3();
      if (ray.ray.intersectPlane(new THREE.Plane(new THREE.Vector3(0, 1, 0), 0), hit)) {
        dragging = { a: hit.clone(), b: hit.clone() };
        S.running = false;
      }
    },
    grabMove(ev) {
      if (!dragging) return;
      const r = stage.getBoundingClientRect();
      const ray = new THREE.Raycaster();
      const ndc = new THREE.Vector2(((ev.clientX - r.left) / W) * 2 - 1, -((ev.clientY - r.top) / H) * 2 + 1);
      ray.setFromCamera(ndc, camera);
      const hit = new THREE.Vector3();
      if (ray.ray.intersectPlane(new THREE.Plane(new THREE.Vector3(0, 1, 0), 0), hit)) dragging.b = hit.clone();
      if (dragPreview) {
        dragPreview.geometry.dispose();
        dragPreview.geometry = new THREE.BufferGeometry().setFromPoints([vec3(S.p.x, 0, S.p.z), dragging.b.clone()]);
        dragPreview.computeLineDistances();
        dragPreview.visible = true;
      }
    },
    grabEnd() {
      if (!dragging) return;
      const d = dragging.b.clone().sub(dragging.a);
      if (d.length() > 0.02) {
        S.v = { x: d.x * TAU, z: d.z * TAU };
        S.trail.length = 0;
        S.alat = Math.hypot(S.p.x, S.p.z) / S.ratio;
      }
      dragging = null;
      S.running = true;
      if (dragPreview) dragPreview.visible = false;
    },
  };
}

/* ================================================================
   第 5 步：半径谱（2D 图表）
   ================================================================ */
function makeCh5() {
  const SHELL = D.shell;
  let r0 = SHELL.r0_cal, usePred = false;
  const excluded = new Set();
  let hover = -1;
  const X = n => 46 + ((n + 0.15) / 7.9) * (W - 92);

  function stats() {
    const n = SHELL.a.map(a => Math.log2(a / r0));
    const res = n.map(x => Math.abs(x - Math.round(x)));
    const keep = [];
    for (let i = 0; i < res.length; i++) if (!excluded.has(i)) keep.push(res[i]);
    const F = keep.length ? Math.sqrt(keep.reduce((s, r) => s + r * r, 0) / keep.length) : 0;
    return { n, res, F, keep };
  }

  return {
    is3D: false,
    kicker: "第 5 步 · 半径",
    title: "半径谱与判据的陷阱",
    body: `
      <p>轨道形状由定律定，半径却不是：a 是初值。但把十个半长轴取 log₂，它们落在整数壳层上：
      <span class="mn">rₙ = r₀·2ⁿ</span>（Zb050 命题 4.5）。</p>
      <p><b>陷阱：</b>若 r₀ 由其中三颗定标（这里取木/土/天的几何平均），那三颗的贴合是构造出来的。
      在图上点掉它们，F 从 0.2300 升到 0.2723。<b>定标体的贴合不能算作检验。</b></p>
      <p>判据要非循环，r₀ 必须有独立来源（命题 4.6）。一个已公开的形态把 r₀ 写成不含太阳系量的常数组合，
      给 0.3109 AU，对定标值偏 +1.1%（式 4.5）——代价是五个微观输入的账。</p>`,
    cites: "Zb050 命题 4.5 / 4.6 / 式 (4.5) ｜ 十体：水金地火带木土天海冥",
    hint: "点天体可把它剔出判据；F 即时重算。",
    cam: null,
    build() { },
    update() { },
    hud: () => {
      const s = stats();
      return hudRows([
        ["r₀ (AU)", r0.toFixed(4)],
        ["参与判据", `${SHELL.names.length - excluded.size} / 10`],
        ["F", s.F.toFixed(4)],
        ["参考 F_all", SHELL.F_all.toFixed(4)],
        ["参考 F_keep", SHELL.F_keep.toFixed(4)],
      ]);
    },
    controls(root) {
      const out = el("output", null, r0.toFixed(4));
      const pred = button("用预测值 0.3109", () => {
        r0 = SHELL.r0_pred; usePred = true; inp.value = r0; out.textContent = r0.toFixed(4);
        pred.classList.add("on");
      }, "chip2");
      const inp = range({
        min: 0.27, max: 0.36, step: 0.0001, value: r0,
        onInput: v => { r0 = v; usePred = false; out.textContent = v.toFixed(4); pred.classList.remove("on"); },
      });
      root.append(ctl("r₀", inp, out), pred,
        button("恢复定标值", () => {
          r0 = SHELL.r0_cal; usePred = false; inp.value = r0; out.textContent = r0.toFixed(4);
          pred.classList.remove("on");
        }),
        button("全部纳入", () => excluded.clear()));
    },
    pointer(ev) {
      const r = c2d.getBoundingClientRect();
      const mx = ev.clientX - r.left, my = ev.clientY - r.top;
      const s = stats();
      let best = -1, bd = 30;
      s.n.forEach((n, i) => {
        const d = Math.hypot(X(n) - mx, H * 0.52 - my);
        if (d < bd) { bd = d; best = i; }
      });
      if (ev.type === "move") hover = best;
      if (ev.type === "down" && best >= 0) {
        if (excluded.has(best)) excluded.delete(best); else excluded.add(best);
      }
    },
    chart() {
      ctx.clearRect(0, 0, W, H);
      const padL = 46, padR = 46, pw = W - padL - padR;
      const y0 = H * 0.52;
      const s = stats();
      for (let k = 0; k <= 8; k++) {
        const x = X(k);
        line(x, y0 - 74, x, y0 + 118, "rgba(150,175,210,.11)", 1);
        text(`${k}`, x, y0 + 133, { size: 9.5, mono: true, color: C.faint, align: "center" });
      }
      line(padL - 10, y0, padL + pw + 10, y0, "rgba(150,175,210,.3)", 1);
      text("壳层指数 n = log₂(a/r₀)", padL + pw / 2, y0 + 156, { size: 10, mono: true, color: C.dim, align: "center" });
      s.n.forEach((n, i) => {
        const x = X(n);
        const res = s.res[i];
        const isCal = SHELL.calib.includes(i);
        const isEx = excluded.has(i);
        const col = isEx ? "rgba(140,155,175,.35)" : isCal ? C.warm : C.acc;
        const yy = y0 - 6;
        const rh = res * 210;
        ctx.save();
        ctx.strokeStyle = isEx ? "rgba(140,155,175,.22)" : (isCal ? "rgba(230,180,94,.45)" : "rgba(99,220,198,.42)");
        ctx.beginPath(); ctx.moveTo(x, y0 + 12); ctx.lineTo(x, y0 + 20 + rh); ctx.stroke();
        ctx.restore();
        dot(x, y0 + 20 + rh, 2.2, col);
        dot(x, yy, hover === i ? 6 : 4.2, col, hover === i ? 14 : 6);
        text(SHELL.names[i], x, yy - 22, {
          size: 12, color: isEx ? "rgba(140,155,175,.5)" : C.ink, align: "center",
          weight: hover === i ? 600 : 400,
        });
        text(isEx ? "剔除" : res.toFixed(3), x, y0 + 32 + rh, { size: 8.5, mono: true, color: C.faint, align: "center" });
        if (isCal && !isEx) text("定标", x, yy - 38, { size: 8.5, mono: true, color: "rgba(230,180,94,.75)", align: "center" });
      });
      const big = s.F;
      text(`F = ${big.toFixed(4)}`, padL, H - 128, { size: 22, mono: true, color: C.ink });
      text(`${SHELL.names.length - excluded.size} 个参与 · 参考 F_all=${SHELL.F_all.toFixed(4)}，F_keep=${SHELL.F_keep.toFixed(4)}`,
        padL, H - 104, { size: 10, mono: true, color: C.faint });
      if (excluded.size === 0) text("↳ 试试点掉 木 / 土 / 天", padL + 240, H - 128, { size: 11, mono: true, color: C.dim });
      if (hover >= 0) {
        const i = hover;
        text(`${SHELL.names[i]}：a = ${SHELL.a[i].toFixed(3)} AU，n = ${s.n[i].toFixed(3)}，|n−round| = ${s.res[i].toFixed(3)}`,
          W - 24, H - 96, { size: 10.5, mono: true, color: C.ink, align: "right" });
      }
      text("残差杆越长，离整数壳越远", padL, H - 22, { size: 9.5, mono: true, color: C.faint });
    },
  };
}

/* ================================================================
   第 6 步：地月（3D）
   ================================================================ */
function makeCh6() {
  const E = D.em;
  let a = E.a0;
  let playing = false;
  let moonAng = 0.8;
  const aMin = 250000, aMax = Math.round(E.af);
  let earth = null, moon = null, orbitRing = null, syncRing = null, a0Ring = null, afRing = null, earthLabel = null;
  const SCALE = 1 / 100000; // km -> 单位

  function dayOf(a) {
    const Lorb = E.mu * Math.sqrt(E.GM * a * 1e3);
    const Lspin = E.Ltot - Lorb;
    if (Lspin <= 1e-3) return Infinity;
    return (TAU * E.IE / Lspin) / 3600;
  }
  const monthOf = a => (TAU * Math.sqrt(Math.pow(a * 1e3, 3) / E.GM)) / 86400;

  function ring(rKm, color, opacity, dash) {
    return lineLoop(circlePoints(rKm * SCALE, 160), color, opacity);
  }

  function build() {
    clearScene();
    earth = new THREE.Mesh(new THREE.SphereGeometry(0.34, 32, 24),
      new THREE.MeshStandardMaterial({ color: 0x3d8fc4, roughness: 0.8, metalness: 0.0, emissive: 0x0a2030 }));
    scene.add(earth);
    earth.add(glow(0x6fc8ff, 0.9, 0.35));

    moon = new THREE.Mesh(new THREE.SphereGeometry(0.095, 24, 18),
      new THREE.MeshStandardMaterial({ color: 0xd8d4c8, roughness: 0.95, metalness: 0.0, emissive: 0x1a1a18 }));
    scene.add(moon);

    a0Ring = ring(E.a0, 0x8b98ad, 0.22);
    afRing = ring(E.af, 0x8b98ad, 0.12);
    syncRing = ring(E.a_sync, 0xe6b45e, 0.5);
    orbitRing = ring(a, 0x63dcc6, 0.16);
    scene.add(a0Ring, afRing, syncRing, orbitRing);

    const lights = new THREE.Group();
    lights.add(new THREE.AmbientLight(0xffffff, 0.65));
    const dl = new THREE.DirectionalLight(0xffffff, 0.9);
    dl.position.set(1.2, 0.8, 0.6);
    lights.add(dl);
    scene.add(lights);

    earthLabel = labelSprite("地球", "#9fd8ff", 1).translateY(0.95);
    scene.add(earthLabel);
    ctrl.reset({ r: 8.0, theta: 0.55, phi: 1.08, minR: 0.8, maxR: 40 });
  }

  return {
    is3D: true,
    kicker: "第 6 步 · 地月",
    title: "潮汐：把角动量从自转搬到轨道",
    body: `
      <p>潮汐场是势的 Hessian：</p>
      <div class="formula">E<sub>ij</sub> = −(<i>Q</i>/4πσ)(3n<sub>i</sub>n<sub>j</sub> − δ<sub>ij</sub>)/r³</div>
      <p>径向拉伸、横向压缩（Zb052 定理 1.1）。地球自转快于月球公转（ω_s &gt; ω_o），
      隆起被带向前方，力矩把角动量从自转交给轨道：<b>月球外移、一天变长</b>（定理 3.1–3.2）。
      同步半径 a_sync = (κ_tot/ω_s²)<sup>1/3</sup> 是分界（定理 2.1）。</p>
      <p>终态由 L_tot 守恒定：F(a) = μ√(κa) + (I₁+I₂)√(κ/a³) = L_tot，取 a &gt; a* 的根（定理 4.1）。
      代入实测值：<b>a_f ≈ 1.44 a₀、T_f ≈ 47.2 天</b>。</p>
      <p>边界：退行速率要耗散/滞后模型（具名条件 C），本库不给时间表；下面的轴按距离参数化。</p>
      <p>顺带：当前 T_E/T_M = 5/α⁻¹，差 −0.039%（Zb050 命题 4.2，恒星日/恒星月口径）。</p>`,
    cites: "Zb052 定理 1.1 / 2.1 / 3.1–3.2 / 4.1 ｜ Zb050 命题 4.2 ｜ 实测值外接",
    hint: "拖动旋转 · 滚轮缩放。拖距离轴看月球外移、日长变长。",
    cam: { r: 8.0, theta: 0.55, phi: 1.08, minR: 0.8, maxR: 40 },
    build,
    update(dt) {
      if (playing) {
        a += (aMax - aMin) * 0.055 * dt;
        if (a >= aMax) { a = aMax; playing = false; }
        const inp = $("#controls input[type=range]");
        const out = $("#controls output");
        if (inp) inp.value = a;
        if (out) out.textContent = `${Math.round(a).toLocaleString()} km`;
      }
      if (earthLabel) earthLabel.userData.fit(camera.position.distanceTo(ctrl.target));
      moonAng += dt * 0.26;
      const r = a * SCALE;
      moon.position.set(Math.cos(moonAng) * r, 0, Math.sin(moonAng) * r);
      // 潮汐隆起：把地球沿月向拉长，随距离趋近同步时滞后角变小
      const lag = clamp(12 * (monthOf(a) / (dayOf(a) / 24) - 1) / 26, 0, 12) * Math.PI / 180;
      const ang = moonAng + lag;
      earth.rotation.set(0, -ang, 0);
      earth.scale.set(1.14, 1.0, 0.96);
      orbitRing.geometry.dispose();
      orbitRing.geometry = new THREE.BufferGeometry().setFromPoints(circlePoints(r, 160));
    },
    hud: () => {
      const d = dayOf(a), m = monthOf(a);
      return hudRows([
        ["月地距离", `${Math.round(a).toLocaleString()} km`],
        ["月周期", `${fmt(m, 2)} d`],
        ["日长", d > 47 ? `${fmt(d / 24, 2)} d` : `${fmt(d, 2)} h`],
        ["L_orb / L_tot", `${fmt((E.mu * Math.sqrt(E.GM * a * 1e3) / E.Ltot) * 100, 1)} %`],
      ]);
    },
    controls(root) {
      const out = el("output", null, `${Math.round(a).toLocaleString()} km`);
      const inp = range({
        min: aMin, max: aMax, step: 500, value: a,
        onInput: v => { a = v; out.textContent = `${Math.round(v).toLocaleString()} km`; playing = false; },
      });
      root.append(
        ctl("月地距离", inp, out),
        button("回到现在", () => {
          a = E.a0; inp.value = a; out.textContent = `${Math.round(a).toLocaleString()} km`; playing = false;
        }),
        toggle("回放", false, v => { playing = v; if (v && a >= aMax - 1000) { a = aMin; inp.value = a; } }),
        viewBtn());
    },
    chart() {
      const px = W - 356, py = 300, gw = 320, gh = 150;
      if (gw < 140) return;
      ctx.save();
      ctx.fillStyle = "rgba(8,13,22,.72)"; ctx.strokeStyle = C.line;
      ctx.beginPath(); ctx.rect(px - 12, py - 30, gw + 24, gh + 44); ctx.fill(); ctx.stroke();
      ctx.restore();
      text("日长 与 月长（天，对数）：a_f 处相交", px, py - 14, { size: 9.5, mono: true, color: C.dim });
      const X2 = v => px + ((v - aMin) / (aMax - aMin)) * gw;
      const Y2 = d => py + gh - (Math.log(d / 0.3) / Math.log(60 / 0.3)) * gh;
      line(px, py + gh, px + gw, py + gh, C.line);
      [0.3, 1, 3, 10, 30].forEach(d => {
        line(px, Y2(d), px + gw, Y2(d), C.grid);
        text(d < 1 ? "0.3" : String(d), px - 6, Y2(d), { size: 8.5, mono: true, color: C.faint, align: "right" });
      });
      [["月长", monthOf, "rgba(99,220,198,.6)"], ["日长", aa => dayOf(aa) / 24, "rgba(230,180,94,.65)"]].forEach(([nm, f, col]) => {
        ctx.beginPath();
        for (let i = 0; i <= 80; i++) {
          const aa = aMin + (aMax - aMin) * i / 80;
          const yy = Y2(f(aa));
          i ? ctx.lineTo(X2(aa), yy) : ctx.moveTo(X2(aa), yy);
        }
        ctx.strokeStyle = col; ctx.lineWidth = 1.3; ctx.stroke();
      });
      line(X2(a), py, X2(a), py + gh, "rgba(233,238,247,.16)", 1, [2, 3]);
      dot(X2(a), Y2(monthOf(a)), 2.6, C.acc);
      dot(X2(a), Y2(dayOf(a) / 24), 2.6, C.warm);
      text("月长", px + 6, py + 12, { size: 9, mono: true, color: C.acc });
      text("日长", px + 6, py + 26, { size: 9, mono: true, color: C.warm });
    },
  };
}

/* ================================================================
   第 7 步：账本 + 太阳偏置（3D）
   ================================================================ */
function makeCh7() {
  let phase = 0, sun = null, jup = null, ch7JupLabel = null;
  const ch7Labels = [];
  const bR = D.bias[0].b / D.Rsun;

  function build() {
    clearScene();
    const bary = new THREE.Mesh(new THREE.SphereGeometry(0.09, 12, 10),
      new THREE.MeshBasicMaterial({ color: 0xe6b45e }));
    scene.add(bary);
    const cLab = labelSprite("系统质心", "#e6b45e", 1);
    cLab.position.set(0, -1.9, 0);
    scene.add(cLab);
    scene.add(lineLoop([vec3(0, 0, 0), vec3(0, -1.65, 0)], 0xe6b45e, 0.35));
    ch7Labels.push(cLab);

    sun = new THREE.Mesh(new THREE.SphereGeometry(1, 40, 28),
      new THREE.MeshBasicMaterial({ color: 0xffd98a }));
    scene.add(sun);
    sun.add(glow(0xffc061, 3.4, 0.65));

    // 质心圆（太阳中心绕它走）
    scene.add(lineLoop(circlePoints(bR, 128), 0x8b98ad, 0.35));
    const rp = labelSprite(`b = ${bR.toFixed(3)} R⊙`, "#e6b45e", 1);
    rp.position.set(0, bR + 0.7, 0);
    scene.add(rp);
    ch7Labels.push(rp);

    // 木星：距离压缩，仅示意
    jup = new THREE.Mesh(new THREE.SphereGeometry(0.26, 24, 18),
      new THREE.MeshStandardMaterial({ color: 0xd9b08c, roughness: 0.85, emissive: 0x201408 }));
    scene.add(jup);
    scene.add(lineLoop(circlePoints(4.2, 168), 0xd9b08c, 0.2));
    const jl = labelSprite("木星（压缩）", "#c9a98a", 1);
    jl.position.set(0, 0.75, 4.5);
    scene.add(jl);
    ch7Labels.push(jl);
    ch7JupLabel = jl;

    const lights = new THREE.Group();
    lights.add(new THREE.AmbientLight(0xffffff, 0.7));
    const dl = new THREE.DirectionalLight(0xffffff, 0.7);
    dl.position.set(3, 2, 2);
    lights.add(dl);
    scene.add(lights);

    ctrl.reset({ r: 10.5, theta: 0.6, phi: 1.10, minR: 1.5, maxR: 60 });
  }

  return {
    is3D: true,
    kicker: "第 7 步 · 账本",
    title: "哪些是导出，哪些是买来的",
    body: `
      <p>太阳也不是不动的：</p>
      <div class="formula"><i>b</i><sub>p</sub> = <i>a</i><sub>p</sub> <i>m</i><sub>p</sub> /(<i>M</i> + <i>m</i><sub>p</sub>)</div>
      <p>木星单独把太阳拉离质心 <b>742,444 km = 1.067 R⊙</b>（Zb086 命题 3.1）——太阳中心在太阳本体之外。
      这是代入观测值的结果，不是框架预言。</p>
      <table class="ledger">
        <tr><th>量</th><th>档位</th><th>出处</th></tr>
        <tr><td>1/r² 力</td><td class="t d">导出</td><td class="t">Zb012·Zb051</td></tr>
        <tr><td>κ = Q/4πσ</td><td class="t d">导出</td><td class="t">Zb051</td></tr>
        <tr><td>椭圆 / T²∝a³</td><td class="t d">导出</td><td class="t">Zb051</td></tr>
        <tr><td>源荷 ↔ 质量</td><td class="t c">条件 C</td><td class="t">Zb017</td></tr>
        <tr><td>q/m 普适</td><td class="t c">条件 C</td><td class="t">Zb051</td></tr>
        <tr><td>e / 相位 / a</td><td class="t i">初值</td><td class="t">Zb051</td></tr>
        <tr><td>坐标 r(t)</td><td class="t i">选择 I</td><td class="t">Zb051</td></tr>
        <tr><td>a、T 的米制值</td><td class="t a">锚</td><td class="t">Zb005·Zb050</td></tr>
        <tr><td>潮汐张量</td><td class="t d">导出</td><td class="t">Zb052</td></tr>
        <tr><td>同步半径</td><td class="t d">导出</td><td class="t">Zb052</td></tr>
        <tr><td>耗散 / 滞后</td><td class="t c">条件 C</td><td class="t">Zb052</td></tr>
        <tr><td>转动惯量 / a₀</td><td class="t i">外部输入</td><td class="t">Zb052</td></tr>
      </table>
      <p>一句话：<b>定律是导出的，半径与偏心率是初值，绝对大小靠锚。</b>
      "轨道怎么形成"在 Zero 里被拆成三问：形状（导出）、周期（导出）、半径分布（壳层判据，非循环来源未收口）。</p>`,
    cites: "Zb086 命题 3.1 ｜ 表 3.1 ｜ R⊙ = 6.957×10⁵ km",
    hint: "拖动旋转 · 滚轮缩放。太阳中心绕质心走，半径 1.067 R⊙。",
    cam: { r: 10.5, theta: 0.6, phi: 1.10, minR: 1.5, maxR: 60 },
    build,
    update(dt) {
      phase += dt * 0.25;
      sun.position.set(Math.cos(phase) * bR, 0, Math.sin(phase) * bR);
      jup.position.set(-4.2 * Math.cos(phase), 0, -4.2 * Math.sin(phase));
      if (ch7JupLabel) ch7JupLabel.position.set(jup.position.x, 0.85, jup.position.z);
      const dCam = camera.position.distanceTo(ctrl.target);
      ch7Labels.forEach(l => l.userData.fit(dCam));
    },
    hud: () => "",
    controls(root) { root.append(viewBtn()); },
  };
}

/* ================================================================
   应用骨架
   ================================================================ */
const chapters = [makeCh1(), makeCh2(), makeCh3(), makeCh4(), makeCh5(), makeCh6(), makeCh7()];
const RAIL = ["势", "力", "轨道", "周期", "半径", "地月", "账本"];
let cur = 0, cur3D = true;
const rail = $("#rail"), hud = $("#hud"), controls = $("#controls"), hint = $("#hint");
const narr = $("#narr");

chapters.forEach((ch, i) => {
  const b = el("button", "step");
  b.append(el("b", null, String(i + 1)), document.createTextNode(RAIL[i]));
  b.addEventListener("click", () => go(i));
  rail.append(b);
});

function curCam() { return chapters[cur].camNow || chapters[cur].cam || { r: 10, theta: .6, phi: 1.1 }; }

function go(i) {
  cur = i;
  const ch = chapters[i];
  cur3D = !!ch.is3D;
  [...rail.children].forEach((b, k) => b.classList.toggle("on", k === i));
  $("#kicker").textContent = ch.kicker;
  $("#ctitle").textContent = ch.title;
  $("#cbody").innerHTML = ch.body;
  $("#ccites").textContent = ch.cites;
  hint.textContent = ch.hint || "";
  stage.classList.toggle("mode2d", !cur3D);
  glc.style.display = cur3D ? "block" : "none";
  clearScene();
  ctrl.chapter = ch;
  if (ch.is3D) {
    ch.build && ch.build();
    ctrl.reset(curCam());
    ctrl.apply();
  } else {
    ctx.clearRect(0, 0, W, H);
  }
  controls.innerHTML = "";
  ch.controls && ch.controls(controls);
  hud.innerHTML = "";
  hudAcc = 1;
}

/* 2D 图表章的指针 */
c2d.addEventListener("pointermove", ev => {
  const ch = chapters[cur];
  if (!cur3D && ch.pointer) ch.pointer({ type: "move", clientX: ev.clientX, clientY: ev.clientY });
});
c2d.addEventListener("pointerdown", ev => {
  const ch = chapters[cur];
  if (!cur3D && ch.pointer) ch.pointer({ type: "down", clientX: ev.clientX, clientY: ev.clientY });
});

window.addEventListener("keydown", e => {
  if (e.target && /input|textarea/i.test(e.target.tagName)) return;
  if (e.key === "ArrowRight") { go((cur + 1) % chapters.length); e.preventDefault(); }
  if (e.key === "ArrowLeft") { go((cur + chapters.length - 1) % chapters.length); e.preventDefault(); }
});

function resize() {
  const r = stage.getBoundingClientRect();
  W = Math.max(320, r.width); H = Math.max(240, r.height);
  DPR = Math.min(2, window.devicePixelRatio || 1);
  c2d.width = Math.round(W * DPR); c2d.height = Math.round(H * DPR);
  c2d.style.width = W + "px"; c2d.style.height = H + "px";
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  if (renderer) {
    renderer.setPixelRatio(DPR);
    renderer.setSize(W, H, false);
    camera.aspect = W / H;
    camera.updateProjectionMatrix();
  }
}

let last = performance.now(), hudAcc = 0, lastW = 0, lastH = 0;
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  const r = stage.getBoundingClientRect();
  if (Math.abs(r.width - lastW) > 0.5 || Math.abs(r.height - lastH) > 0.5) {
    lastW = r.width; lastH = r.height;
    resize();
  }
  const ch = chapters[cur];
  ctx.clearRect(0, 0, W, H);
  if (ch.is3D && renderer) {
    ch.update(dt);
    ctrl.apply();
    renderer.render(scene, camera);
    if (ch.chart) ch.chart();
  } else {
    ch.chart && ch.chart();
  }
  hudAcc += dt;
  if (hudAcc > 0.12) {
    hudAcc = 0;
    hud.innerHTML = ch.hud ? ch.hud() : "";
  }
  requestAnimationFrame(frame);
}

/* ---------------- 自检 ---------------- */
const ST = [];
function st(name, ok, detail) { ST.push({ name, ok: !!ok, detail }); }
function selfTest() {
  st("F_all ≈ 0.2300", Math.abs(D.shell.F_all - 0.23) < 2e-3, D.shell.F_all.toFixed(4));
  st("F_keep ≈ 0.2723", Math.abs(D.shell.F_keep - 0.2723) < 2e-3, D.shell.F_keep.toFixed(4));
  let worst = 0;
  D.planets.forEach(p => { worst = Math.max(worst, Math.abs(4 * Math.PI ** 2 * p.a ** 3 / p.T ** 2 / (4 * Math.PI ** 2) - 1)); });
  st("T²∝a³ 最大偏离 < 1%", worst < 0.01, (worst * 100).toFixed(3) + "%");
  const a_f = D.em.af * 1e3, GMt = D.em.GM;
  const Tm = 2 * Math.PI * Math.sqrt(a_f ** 3 / GMt) / 86400;
  st("a_f/a₀ ≈ 1.44", Math.abs(D.em.af / D.em.a0 - 1.44) < 0.01, (D.em.af / D.em.a0).toFixed(4));
  st("T_f ≈ 47.2 d", Math.abs(Tm - 47.2) < 0.1, Tm.toFixed(2));
  const day0 = (2 * Math.PI * D.em.IE / (D.em.Ltot - D.em.mu * Math.sqrt(GMt * D.em.a0 * 1e3))) / 3600;
  st("当前日长 ≈ 23.93 h", Math.abs(day0 - 23.934) < 0.01, day0.toFixed(3));
  let p = { x: 1, z: 0 }, v = { x: 0, z: 2 * Math.PI }, h0 = p.x * v.z - p.z * v.x;
  let maxR = 0, maxDh = 0;
  const dt = 2e-4;
  for (let i = 0; i < 3 / dt; i++) {
    const r0 = Math.hypot(p.x, p.z);
    v.x += (-GM * p.x / r0 ** 3) * dt / 2; v.z += (-GM * p.z / r0 ** 3) * dt / 2;
    p.x += v.x * dt; p.z += v.z * dt;
    const r1 = Math.hypot(p.x, p.z);
    v.x += (-GM * p.x / r1 ** 3) * dt / 2; v.z += (-GM * p.z / r1 ** 3) * dt / 2;
    maxR = Math.max(maxR, Math.abs(Math.hypot(p.x, p.z) - 1));
    maxDh = Math.max(maxDh, Math.abs(p.x * v.z - p.z * v.x - h0));
  }
  st("圆轨道半径漂移 < 1e-3", maxR < 1e-3, maxR.toExponential(2));
  st("角动量漂移 < 1e-5", maxDh < 1e-5, maxDh.toExponential(2));
  st("木星偏置 742,444 km", Math.abs(D.bias[0].b - 742444) < 200, Math.round(D.bias[0].b).toString());
  st("WebGL 可用", !!renderer, renderer ? "ok" : "no");
  const bad = ST.filter(s => !s.ok);
  window.__SELFTEST = { pass: ST.length - bad.length, total: ST.length, items: ST };
  const box = document.createElement("div");
  box.id = "selftest";
  box.style.display = "none";
  box.textContent = `SELFTEST ${ST.length - bad.length}/${ST.length} ` +
    ST.map(s => `${s.ok ? "PASS" : "FAIL"}:${s.name}=${s.detail}`).join(" | ");
  document.body.appendChild(box);
}

/* ---------------- 启动 ---------------- */
const QS = new URLSearchParams(location.search);
const START = clamp((+(QS.get("ch") || 1)) - 1, 0, chapters.length - 1);
const FF = clamp(+(QS.get("ff") || 0), 0, 800);
resize();
go(START);
if (QS.get("r")) ctrl.r = clamp(+QS.get("r"), ctrl.minR, ctrl.maxR);
for (let i = 0; i < FF; i++) {
  const ch = chapters[cur];
  if (ch.is3D) ch.update(0.05); else { break; }
}
selfTest();
requestAnimationFrame(t => { last = t; requestAnimationFrame(frame); });
</script>
</body>
</html>
